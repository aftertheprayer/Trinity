a class=\"active\" href=\"#world\">세계의 구조\u003c/a>\u003ca href=\"#academies\">3대 아카데미\u003c/a>\u003ca href=\"#magic\">마법과 발현\u003c/a>\u003ca href=\"#system\">속성과 전문 분야\u003c/a>\u003ca href=\"#outer\">아우터 도감\u003c/a>\u003ca href=\"#events\">연합 행사\u003c/a>\u003ca href=\"#hidden\">세계의 이면\u003c/a>\u003ca href=\"./personnel.html\">아카데미 인명록\u003c/a>\u003c/nav>\u003cdiv class=\"sidefoot\">THREE WORLDS. ONE NEXUS.\u003cbr>소설 세계관 설정집\u003c/div>\u003c/aside>\u003cmain id=\"home\">\u003cdiv class=\"editorbar\">\u003cbutton class=\"btn\" id=\"designworld\">색상·무늬 편집\u003c/button>\u003cbutton class=\"btn\" id=\"editmode\">세계관 편집\u003c/button>\u003cbutton class=\"btn\" id=\"saveworld\" hidden>변경 저장\u003c/button>\u003cbutton class=\"btn\" id=\"cancelworld\" hidden>취소\u003c/button>\u003cbutton class=\"btn\" id=\"backupall\">전체 백업\u003c/button>\u003cbutton class=\"btn\" id=\"restoreall\">백업 복원\u003c/button>\u003cinput type=\"file\" id=\"fullbackup\" accept=\"application/json\">\u003cspan id=\"editnotice\" role=\"status\">편집한 내용은 이 브라우저에 저장됩니다.\u003c/span>\u003c/div>\u003cheader class=\"topbar\">\u003cspan>TRINITY NEXUS / SETTING ARCHIVE\u003c/span>\u003cinput class=\"search\" id=\"search\" placeholder=\"세계관 검색…\" aria-label=\"세계관 검색\">\u003c/header>\u003cdiv class=\"content\">\u003cdiv id=\"results\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"hero\">\u003cdiv class=\"eyebrow\">세 세계가 만나는 곳\u003c/div>\u003ch1>Trinity\u003cbr>\u003cem>Nexus.\u003c/em>\u003c/h1>\u003cp>천계와 하계, 그리고 인간계.\u003cbr>서로 다른 운명이 교차하고, 힘과 선택이 질서를 만드는 세계의 기록.\u003c/p>\u003cdiv class=\"hero-meta\">\u003cspan>03 REALMS\u003c/span>\u003cspan>03 ACADEMIES\u003c/span>\u003cspan>01 PUBLIC INSTITUTION\u003c/span>\u003c/div>\u003cdiv class=\"geometry-art geo\" data-geometry=\"world\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"orbit\" aria-hidden=\"true\">\u003cspan>✧\u003c/span>\u003c/div>\u003c/div>\n\u003csection id=\"world\">\u003cdiv class=\"sectionhead\">\u003ch2>세계의 구조\u003c/h2>\u003cspan class=\"en\">THE THREE REALMS\u003c/span>\u003c/div>\u003cp class=\"intro\">세상은 천계·하계·인간계로 나뉜다. 마법 제작자가 만든 게이트를 통해 자유롭게 왕래하며, 다양한 종족이 같은 시대를 살아간다. 천계에는 과거의 종족적 우월의식에서 비롯된 권위적인 문화가 일부 남아 있으며, 하계는 폐쇄적인 사회를 이룬다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003cspan class=\"tag\">교류의 중심\u003c/span>\u003ch3>게이트로 연결된 일상\u003c/h3>\u003cp>천족·마족·인간을 비롯한 모든 종족이 교류한다. 인간계의 센트럴 유니온은 세 세계의 정중앙에 위치한 중심지다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003cspan class=\"tag\">공공의 적\u003c/span>\u003ch3>세계 바깥의 위협, 아우터\u003c/h3>\u003cp>세계를 파괴하려는 이성 없는 인외의 괴물. 세 세계는 종족 간 경쟁을 이어가면서도 아우터라는 절대적인 공동의 적에 맞선다.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003csection id=\"academies\">\u003cdiv class=\"sectionhead\">\u003ch2>3대 아카데미와 특수청\u003c/h2>\u003cspan class=\"en\">ACADEMIES & ZENITH\u003c/span>\u003c/div>\u003cp class=\"intro\">세 아카데미는 각자의 질서와 문화를 지닌 배움의 장이다. 제니스특수청은 별도의 최정예 공공기관이다. 각 소속의 상징색과 꽃 엠블럼을 담은 제복을 착용한다.\u003c/p>\u003cdiv class=\"grid\" id=\"schools\">\u003c/div>\u003cdiv class=\"quote\">Prime — 학생회 역할을 수행하며 학교를 대표하는 정예부대.\u003c/div>\u003cp class=\"intro\">유니온 프라임 · 아르카디아 프라임 · 녹턴 프라임\u003c/p>\u003c/section>\n\u003csection id=\"magic\">\u003cdiv class=\"sectionhead\">\u003ch2>마법과 발현\u003c/h2>\u003cspan class=\"en\">MANA & AWAKENING\u003c/span>\u003c/div>\u003cp class=\"intro\">모든 존재는 마력을 가지고 태어나며 고유 속성이 발현된다. 아직 고유 속성이 발현되지 않은 존재는 블랭크라 부른다. 마법의 사용 범위는 발현 상태와 교육·연마 정도에 따라 달라진다.\u003c/p>\u003cdiv class=\"steps\">\u003cdiv class=\"step\">\u003cstrong>태생 · 마력\u003c/strong>\u003cp>모든 존재는 태어날 때부터 마력을 지닌다.\u003c/p>\u003c/div>\u003cdiv class=\"step\">\u003cstrong>발현 · 고유 속성\u003c/strong>\u003cp>고유 속성이 발현되며, 각자의 속성에 맞는 마법을 배워 연마한다.\u003c/p>\u003c/div>\u003cdiv class=\"step\">\u003cstrong>미발현 · 블랭크\u003c/strong>\u003cp>고유 속성이 발현되지 않은 자. 기본 마법은 배울 수 있으나 고유 속성 마법과 고위 마법은 사용하기 어렵다.\u003c/p>\u003c/div>\u003c/div>\u003ch4>기초 교육과 아카데미 입학\u003c/h4>\u003cp class=\"intro\">초·중·고 기관을 통해 기본 마법을 배운다. 기초 교육을 받은 이후 아카데미에 입학할 수 있다. 아카데미에 입학하지 않고 일반인으로 살아가는 경우에는 공격 마법의 대부분이 제한되며, 생활 마법과 기초 마법을 활용해 일상을 보낸다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003cspan class=\"tag\">MANA OVERLOAD\u003c/span>\u003ch3>마력 과부하\u003c/h3>\u003cp>자신이 가진 마력량보다 많은 마력을 사용하거나, 제대로 연마하지 않은 마법을 사용하면 마력 과부하가 발생한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003cspan class=\"tag\">RECOVERY & TUNING\u003c/span>\u003ch3>물약과 회로 튜닝\u003c/h3>\u003cp>과부하에는 물약을 사용할 수 있다. 마법 회로가 손상되었다면 튜너에게 가서 튜닝을 받아야 한다. 물약을 과하게 사용하면 중독 현상이 일어날 수 있다.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003csection id=\"system\">\u003cdiv class=\"sectionhead\">\u003ch2>속성과 전문 분야\u003c/h2>\u003cspan class=\"en\">ATTRIBUTES & SPECIALTIES\u003c/span>\u003c/div>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003cspan class=\"tag\">CED\u003c/span>\u003ch3>엑스큐터 · Executor\u003c/h3>\u003cp>전투집행부 / Combat Execution Division\u003c/p>\u003cp>전투를 담당하는 계열. 자신의 고유 속성과 연마한 마법을 활용해 임무를 수행한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003cspan class=\"tag\">TCD\u003c/span>\u003ch3>아키텍트 · Architect\u003c/h3>\u003cp>전술통제부 / Tactical Control Division\u003c/p>\u003cp>튜닝·조제·보호·치유·강화 등 각자의 전문 분야에서 활동하는 서포터 계열.\u003c/p>\u003c/article>\u003c/div>\u003cp class=\"intro\">고유 속성의 큰 분류에는 원소·자연·명암·특수·시공간 등이 있다. 아키텍트의 전문 분야에는 튜너·알케미스트·가디언·힐러·버퍼 등이 있으며, 속성과 전문 분야는 구분해 기록한다.\u003c/p>\u003cdiv class=\"roles\">\u003cbutton class=\"btn selected\" data-role=\"executor\">속성 분류\u003c/button>\u003cbutton class=\"btn\" data-role=\"architect\">아키텍트 분야\u003c/button>\u003c/div>\u003cdiv class=\"rolelist\" id=\"rolelist\">\u003c/div>\u003c/section>\n\u003csection id=\"outer\">\u003cdiv class=\"sectionhead\">\u003ch2>아우터 도감\u003c/h2>\u003cspan class=\"en\">THREAT CLASSIFICATION\u003c/span>\u003c/div>\u003cp class=\"intro\">세계를 파괴하려는 인외의 괴물. 위험도에 따라 침식급부터 종말급까지 여섯 단계로 분류한다.\u003c/p>\u003cdiv id=\"levels\">\u003c/div>\u003c/section>\n\u003csection id=\"events\">\u003cdiv class=\"sectionhead\">\u003ch2>연합 행사\u003c/h2>\u003cspan class=\"en\">ANNUAL CHRONICLE\u003c/span>\u003c/div>\u003cdiv class=\"event\">\u003cdiv class=\"date\">01.01\u003cbr>07.01\u003csmall>매년 두 차례\u003c/small>\u003c/div>\u003cdiv>\u003ch3>랭킹전 · Ranking Battle\u003c/h3>\u003cspan class=\"tag\">센트럴 유니온\u003c/span>\u003cp>엑스큐터와 아키텍트가 페어를 맺어 겨루는 2:2 대항전. 1일 개막 후 이틀 뒤 첫 경기가 열리며, 2~3일 간격으로 일주일 동안 총 세 경기를 치러 누적 점수로 순위를 정한다.\u003c/p>\u003cp>눈에 띄는 참가자는 자금력과 권력을 지닌 세력의 개인 후원을 받을 수 있다. 제니스특수청은 최정예 아카데미생에게 직접 접촉하거나 선발 시험으로 인원을 모집한다. 기존 랭킹전의 제니스 입학 특전은 새로운 공공기관 체계에 맞춰 추후 확정한다.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"event\">\u003cdiv class=\"date\">APR\u003csmall>매년 4월 초\u003c/small>\u003c/div>\u003cdiv>\u003ch3>3대 아카데미 연합 실습\u003c/h3>\u003cspan class=\"tag\">아카데미 외곽 순환 개최\u003c/span>\u003cp>세 아카데미의 우수 학생과 프라임, 지도 교수진, 일반 아카데미생들이 팀을 꾸려 실전 마수 토벌과 미개척 던전 탐사를 수행한다. 협력과 실전을 함께 경험하는 대규모 연합 실습이다.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"event\">\u003cdiv class=\"date\">10.10\u003csmall>매년 개최\u003c/small>\u003c/div>\u003cdiv>\u003ch3>별빛축제 · Starlight Festival\u003c/h3>\u003cspan class=\"tag\">센트럴 유니온\u003c/span>\u003cp>종족 간 화합과 학생 교류를 위한 가장 성대한 연합 축제. 사복과 예복을 입고 공연, 마법 시연, 야시장을 즐긴다. 화려한 축제의 뒤편에서는 타교 학생들과의 마찰이나 뒷세계의 은밀한 거래가 벌어지기도 한다.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"hidden\">\u003cdiv class=\"sectionhead\">\u003ch2>세계의 이면\u003c/h2>\u003cspan class=\"en\">HIDDEN ORGANIZATIONS\u003c/span>\u003c/div>\u003cp class=\"intro\">세 세계의 질서 뒤에는 정체와 활동을 숨긴 불법 조직들이 존재한다. 그중 가장 큰 불법 조직은 신디케이트다.\u003c/p>\u003cdiv class=\"grid\">\u003carticle class=\"card\">\u003ch3>신디케이트\u003c/h3>\u003cp>가장 큰 규모의 숨은 불법 조직. 아카데미 시스템에 환멸을 느끼거나 마법 사용 등의 제약에 불만을 품은 이들이 가담하기도 한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>인신매매와 불법 경매\u003c/h3>\u003cp>센트럴 유니온의 사각지대에서는 인신매매와 불법 경매가 이루어지기도 한다. 수인이나 희귀 종족은 거래와 착취의 표적이 된다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>수인·희귀 종족 투기장\u003c/h3>\u003cp>수인과 희귀 종족을 이용한 불법 투기장도 운영된다. 이곳에서 약자들은 불법 조직에 의해 착취당한다.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ch3>불법 생체 실험\u003c/h3>\u003cp>일부 숨은 조직은 아우터 인자나 고위 마력 회로를 강제 이식하는 불법 생체 실험을 자행한다.\u003c/p>\u003c/article>\u003carticle class=\"card\" style=\"grid-column:1/-1\">\u003cspan class=\"tag\">ZENITH / INVESTIGATION\u003c/span>\u003ch3>제니스특수청의 조사와 제압\u003c/h3>\u003cp>제니스특수청에는 이들 조직과 불법 거래·투기장·생체 실험을 조사하고, 범죄 조직을 제압해 해체하려는 담당 부서가 있다. 구체적인 부서명은 아직 확정하지 않았다.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003csection id=\"personnel\">\u003cdiv class=\"sectionhead\">\u003ch2>아카데미 인명록\u003c/h2>\u003cspan class=\"en\">PERSONNEL ARCHIVE\u003c/span>\u003c/div>\u003cp class=\"intro\">학교별·직책별로 인물을 정리하고, 사진과 상세 설정을 기록하세요. 카드를 누르면 상세 정보를 볼 수 있습니다. 편집은 코드 인증 후 가능합니다.\u003c/p>\u003cdiv class=\"toolbar\">\u003ca class=\"btn\" href=\"./personnel.html\">인명록 전체 화면으로 열기\u003c/a>\u003c/div>\u003cdiv class=\"personnel-promo\">\u003ch3>Every name, a story.\u003c/h3>\u003cdiv class=\"hint\">세 아카데미의 학장·교수·프라임·학생과 제니스특수청 부서 인원을 기록하세요.\u003c/div>\u003cdiv class=\"toolbar\">\u003ca class=\"btn\" href=\"personnel.html\">인명록 열기\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"characters\" hidden>\u003cdiv class=\"sectionhead\">\u003ch2>인물 기록\u003c/h2>\u003cspan class=\"en\">CHARACTER ARCHIVE\u003c/span>\u003c/div>\u003cp class=\"intro\">아카데미별 인물과 소속을 기록하는 공간. 아직 등록된 인물은 없습니다. 아래에서 나만의 등장인물을 추가해 보세요.\u003c/p>\u003cdiv class=\"toolbar\">\u003cbutton class=\"btn\" id=\"add\">인물 등록\u003c/button>\u003cbutton class=\"btn\" id=\"export\">기록 백업\u003c/button>\u003cbutton class=\"btn\" id=\"import\">백업 불러오기\u003c/button>\u003cinput type=\"file\" id=\"importfile\" accept=\"application/json\" hidden>\u003c/div>\u003cp class=\"hint\">인물 기록과 사진은 현재 브라우저에만 저장됩니다. 다른 기기로 옮기거나 보관하려면 기록 백업을 이용하세요.\u003c/p>\u003cdiv class=\"roles\" id=\"charfilters\">\u003c/div>\u003cdiv class=\"grid\" id=\"charlist\">\u003c/div>\u003c/section>\u003cfooter>TRINITY NEXUS / WORLD ARCHIVE · 세 세계의 이야기\u003c/footer>\u003c/div>\u003c/main>\n\u003cdialog id=\"dialog\">\u003cform id=\"form\">\u003ch2>새로운 인물 기록\u003c/h2>\u003clabel>이름\u003cinput name=\"name\" required maxlength=\"70\">\u003c/label>\u003clabel>아카데미\u003cselect name=\"school\" id=\"schoolselect\">\u003c/select>\u003c/label>\u003clabel>직책·소속\u003cselect name=\"position\" id=\"position\">\u003c/select>\u003c/label>\u003clabel>속성 / 분야\u003cinput name=\"attribute\" maxlength=\"100\" placeholder=\"예: 빙결 / 힐러\">\u003c/label>\u003clabel>인물 설명\u003ctextarea name=\"description\" maxlength=\"3000\">\u003c/textarea>\u003c/label>\u003clabel>인물 사진\u003cinput type=\"file\" id=\"photo\" accept=\"image/*\">\u003c/label>\u003cdiv class=\"toolbar\">\u003cbutton class=\"btn\" type=\"submit\">등록하기\u003c/button>\u003cbutton class=\"btn\" type=\"button\" id=\"cancel\">취소\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>\n\u003cscript>\nconst schools=[{name:'센트럴 유니온',en:'CENTRAL UNION',color:'#d3dbe9',flower:'✺',realm:'인간계',symbol:'코스모스 · 검은색 + 흰색',text:'가장 큰 세계의 압도적인 규모를 지닌 아카데미. 인간·요정족·드워프가 대표적이며 대부분의 행사가 개최된다.',more:'고도로 발달한 미래도시를 배경으로 자유롭고 활발한 분위기를 지닌다. 압도적인 규모와 인원수, 지리적 이점 덕분에 랭킹전과 대규모 연합 축제가 열린다. 코스모스는 질서·조화·우주를 상징하며 혼돈과 대립한다.'},{name:'아르카디아',en:'ARCADIA',color:'#8faefb',flower:'⚜',realm:'천계',symbol:'백합 · 로열 블루 + 실버',text:'천계의 고결함과 엘리트 의식이 깃든 아카데미. 규율과 품격을 중시한다.',more:'과거 천족의 혈통과 신성성을 우월한 지위의 근거로 삼았던 질서가 일부 가문·교수·관료의 권위주의와 선민의식으로 남아 있다. 모든 천족이 편견을 지닌 것은 아니며 개혁을 지지하는 이들도 존재한다.'},{name:'녹턴',en:'NOCTURNE',color:'#df858f',flower:'✥',realm:'하계',symbol:'글라디올러스 · 다크 레드 + 다크 그레이',text:'푸른 하늘 대신 노을진 하늘이 펼쳐지는 곳. 마족과 수인이 대표적인 폐쇄적 하계의 아카데미.',more:'이클립스는 녹턴 내부에서도 존재를 쉽게 알 수 없는 비밀 암살부대다. 리더와 대원으로 구성되며 대부분 수인이다. 소속원은 프라임이 될 수 없다. 제니스특수청과 대조되는 필요악으로 위험인물과 배신자를 제거한다.'},{name:'제니스특수청',en:'ZENITH',color:'#d7bd7d',flower:'✧',realm:'위치 비공개',symbol:'에델바이스 · 퓨어 화이트 + 골드',text:'국가가 설립한 최정예 의회기관. 고위험 아우터 토벌과 위험 현장 대응, 착취당하는 약자 보호를 수행한다.',more:'이름은 정점을 뜻한다. 통제되고 비밀스러우며 서늘한 분위기를 지닌다. 위치는 철저한 비밀이며 특수 게이트로만 접근할 수 있다. 아카데미가 아닌 공공기관으로 프라임 대신 부서 체계를 갖춘다. 최정예 아카데미생에게 접촉하거나 선발 시험으로 모집한다.'}];\nconst executor=[[\"원소\", \"원소 계열의 고유 속성.\"], [\"자연\", \"자연 계열의 고유 속성.\"], [\"명암\", \"빛과 어둠 등 명암 계열의 고유 속성.\"], [\"특수\", \"특수 계열의 고유 속성.\"], [\"시공간\", \"시간과 공간 등 시공간 계열의 고유 속성.\"]];\nconst architect=[[\"Tuner · 튜너\", \"마법 회로를 조율하고 손상된 회로를 튜닝하는 분야.\"], [\"Alchemist · 알케미스트\", \"물약 등 마법 조제물을 만드는 분야.\"], [\"Guardian · 가디언\", \"방어와 보호를 담당하는 분야.\"], [\"Healer · 힐러\", \"치유를 담당하는 분야.\"], [\"Buffer · 버퍼\", \"능력 강화를 담당하는 분야.\"]];\nconst levels=[['침식급','Erosion','가장 흔하고 약한 개체. 엑스큐터 단독 또는 아카데미 하위권 페어로 토벌 가능.'],['변이급','Mutation','환경을 오염시키며 흉포화된 개체. 기본적인 전술 통제와 마력 튜닝이 요구된다.'],['환란급','Hazard','대규모 사상자를 낼 수 있는 중위험 개체. 상위권 랭커나 전문 토벌 페어가 대응한다.'],['재앙급','Disaster','도시 하나를 궤멸시킬 고위험 개체. 제니스특수청의 주력 토벌 대상.'],['파멸급','Destruction','국가 붕괴 위협. 다수의 프라임급 페어를 투입해야 한다.'],['종말급','Apocalypse','세 세계 전체의 존망을 위협하는 규격 외 재액. 역사상 등장 횟수가 손에 꼽히며, 최고위 아키텍트와 다수의 최강 엑스큐터가 총동원된다.']];\nconst $=s=>document.querySelector(s); const esc=s=>String(s||'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n$('#schools').innerHTML=schools.map(s=>`\u003carticle class=\"card academy\" style=\"--school:${s.color}\">\u003cspan class=\"flower\" aria-hidden=\"true\">${s.flower}\u003c/span>\u003cdiv class=\"schoolen\">${s.en}\u003c/div>\u003ch3>${s.name}${s.name==='제니스특수청'?'':' 아카데미'}\u003c/h3>\u003cspan class=\"tag\">${s.realm}\u003c/span>\u003cp>${s.text}\u003c/p>\u003cp>${s.symbol}\u003c/p>\u003cdetails class=\"detail\">\u003csummary>상세 기록\u003c/summary>\u003cp>${s.more}\u003c/p>\u003c/details>\u003c/article>`).join('');\nlet currentRole='executor';function roles(type){currentRole=type;$('#rolelist').innerHTML=(type==='executor'?executor:architect).map(r=>`\u003cdiv class=\"role\">\u003cstrong>${r[0]}\u003c/strong>\u003cp>${r[1]}\u003c/p>\u003c/div>`).join('');document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('selected',b.dataset.role===type));if(typeof applyWorldEdits==='function')applyWorldEdits()} roles('executor');document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>roles(b.dataset.role));\n$('#levels').innerHTML=levels.map((r,i)=>`\u003cdiv class=\"level\" style=\"--danger:${['#95bda9','#b5c3a1','#c9bd91','#d7a482','#d78986','#e38fbb'][i]}\">\u003cb>${i+1}\u003c/b>\u003cstrong>${r[0]}\u003csmall>${r[1].toUpperCase()}\u003c/small>\u003c/strong>\u003cp>${r[2]}\u003c/p>\u003c/div>`).join('');\nconst searchIndex=[...document.querySelectorAll('main section')].map(s=>({id:s.id,title:s.querySelector('h2').textContent,text:s.textContent}));searchIndex.find(s=>s.id==='system').text+=JSON.stringify(architect);$('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase(),box=$('#results');box.style.display=q?'block':'none';if(!q)return;const found=searchIndex.filter(s=>s.text.toLowerCase().includes(q));box.innerHTML=found.length?found.map(s=>`\u003ca href=\"#${s.id}\">${esc(s.title)} · 관련 설정 보기\u003c/a>`).join(''):'일치하는 설정이 없습니다.'};\nconst observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+e.target.id))}),{rootMargin:'-10% 0px -65% 0px'});document.querySelectorAll('section').forEach(s=>observer.observe(s));\nlet editingPerson=null;let chars=[];try{chars=JSON.parse(localStorage.getItem('trinity-characters')||'[]')}catch{}let filter='전체';function persist(){try{localStorage.setItem('trinity-characters',JSON.stringify(chars));return true}catch{alert('저장 공간이 부족합니다. 사진 크기를 줄여 주세요.');return false}}function render(){const list=chars.filter(c=>filter==='전체'||c.school===filter);$('#charlist').innerHTML=list.length?list.map(c=>`\u003carticle class=\"card character\">${/^data:image\\/(jpeg|png|webp);base64,/.test(c.photo||'')?`\u003cimg class=\"portrait\" alt=\"${esc(c.name)}\" src=\"${c.photo}\">`:''}\u003cspan class=\"tag\">${esc(c.school)}\u003c/span>\u003ch3>${esc(c.name)}\u003c/h3>\u003cp>${esc(c.position)} · ${esc(c.attribute||'속성 미기록')}\u003c/p>\u003cp style=\"white-space:pre-wrap\">${esc(c.description)}\u003c/p>\u003cbutton class=\"edit-person\" data-person=\"${esc(c.id)}\">인물 수정\u003c/button>\u003cbutton class=\"remove\" data-id=\"${esc(c.id)}\">기록 삭제\u003c/button>\u003c/article>`).join(''):'\u003cdiv class=\"empty\" style=\"grid-column:1/-1\">아직 등록된 인물이 없습니다.\u003cbr>새로운 이야기의 주인공을 기록해 보세요.\u003c/div>';$('#characters .intro').textContent=chars.length?`총 ${chars.length}명의 인물이 기록되어 있습니다. 아카데미별로 찾아보세요.`:'아카데미별 인물과 소속을 기록하는 공간. 아래에서 나만의 등장인물을 추가해 보세요.';document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>editPerson(b.dataset.person));document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{if(confirm('이 인물 기록을 삭제할까요?')){const old=chars;chars=chars.filter(c=>String(c.id)!==b.dataset.id);if(!persist())chars=old;render()}});$('#charfilters').innerHTML=['전체',...schools.map(s=>s.name)].map(n=>`\u003cbutton class=\"btn ${filter===n?'selected':''}\" data-filter=\"${n}\">${n}\u003c/button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()})}render();\n$('#schoolselect').innerHTML=schools.map(s=>`\u003coption>${s.name}\u003c/option>`).join('');function positions(){$('#position').innerHTML=($('#schoolselect').value==='제니스특수청'?['부서 소속 인원']:['학장','교수','프라임','전투집행부 학생','전술통제부 학생']).map(n=>`\u003coption>${n}\u003c/option>`).join('')}positions();$('#schoolselect').onchange=positions;$('#add').onclick=()=>{editingPerson=null;$('#form').reset();positions();$('#dialog h2').textContent='새로운 인물 기록';$('#dialog').showModal()};$('#cancel').onclick=()=>$('#dialog').close();async function photoData(file){if(!file)return '';if(!file.type.startsWith('image/'))throw Error('이미지 파일을 선택해 주세요.');return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('사진을 읽을 수 없습니다.'));img.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,600/img.width,600/img.height);c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.8))};img.src=r.result};r.readAsDataURL(file)})}$('#form').onsubmit=async e=>{if(!window.TRINITY_CAN_EDIT){e.preventDefault();return;}e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));const previous=chars.slice();data.id=editingPerson||crypto.randomUUID();data.photo=$('#photo').files[0]?await photoData($('#photo').files[0]):(chars.find(c=>c.id===editingPerson)?.photo||'');if(editingPerson)chars=chars.map(c=>c.id===editingPerson?data:c);else chars.push(data);if(persist()){$('#dialog').close();e.target.reset();positions();filter='전체';render()}else chars=previous}catch(err){alert(err.message)}};\n$('#export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({world:'Trinity Nexus',version:1,characters:chars},null,2)],{type:'application/json'}));a.href=url;a.download='Trinity_Nexus_characters.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onclick=()=>$('#importfile').click();$('#importfile').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.world!=='Trinity Nexus'||!Array.isArray(d.characters)||d.characters.length>500||!d.characters.every(c=>c&&typeof c.name==='string'&&schools.some(s=>s.name===c.school)))throw Error();if(!confirm('현재 인물 기록을 백업 내용으로 교체할까요?'))return;const old=chars;chars=d.characters.map(c=>({...c,id:crypto.randomUUID()}));if(!persist())chars=old;filter='전체';render()}catch{alert('올바른 트리니티 넥서스 백업 파일을 선택해 주세요.')}e.target.value=''};\n\nfunction editPerson(id){if(!window.TRINITY_CAN_EDIT)return;const c=chars.find(c=>String(c.id)===id);if(!c)return;editingPerson=c.id;$('#form').reset();$('#schoolselect').value=c.school;positions();for(const name of ['name','position','attribute','description'])$('#form').elements[name].value=c[name]||'';$('#dialog h2').textContent='인물 기록 수정';$('#dialog').showModal()}\nvar worldEdits;try{worldEdits=JSON.parse(localStorage.getItem('trinity-world-edits')||'{}')}catch{worldEdits={}}var worldEditing=false;var beforeEdits={};\nfunction editableNodes(){const nodes=[];document.querySelectorAll('.hero,main section:not(#characters):not(#personnel)').forEach((container,ci)=>{container.querySelectorAll('h1,h2,h3,h4,p,.quote,.tag,.schoolen,.date,.level strong,.level small,.step strong,.role strong,.eyebrow,.en').forEach((n,ni)=>{if(n.parentElement.closest('[data-edit-key]'))return;const role=n.closest('#rolelist');const revised=['magic','system','hidden'].includes(container.id);const key=role?'specialty-v2-'+currentRole+'-'+ni:revised?'magic-revision-'+container.id+'-'+ni:'section-'+ci+'-'+ni;n.dataset.editKey=key;nodes.push(n)})});return nodes}\nfunction applyWorldEdits(){if(!worldEdits)return;for(const n of editableNodes()){if(Object.hasOwn(worldEdits,n.dataset.editKey))n.innerText=worldEdits[n.dataset.editKey];n.contentEditable=worldEditing?'plaintext-only':'false'}refreshSearch()}\nfunction refreshSearch(){if(typeof searchIndex==='undefined')return;for(const row of searchIndex){const section=document.getElementById(row.id);row.title=section.querySelector('h2').textContent;row.text=section.textContent}searchIndex.find(s=>s.id==='system').text+=JSON.stringify(architect)}\nfunction rememberEdits(){for(const n of document.querySelectorAll('[data-edit-key]'))worldEdits[n.dataset.editKey]=n.innerText}\nfunction setEditMode(on){if(on&&!window.TRINITY_CAN_EDIT)return;worldEditing=on;document.body.classList.toggle('editing',on);$('#saveworld').hidden=!on;$('#cancelworld').hidden=!on;$('#editmode').hidden=on;document.querySelectorAll('[data-role]').forEach(b=>b.disabled=on);applyWorldEdits();$('#editnotice').textContent=on?'수정할 글을 클릭해서 바로 입력한 뒤 변경 저장을 눌러 주세요.':'편집한 내용은 이 브라우저에 저장됩니다.'}\n$('#editmode').onclick=()=>{beforeEdits={...worldEdits};rememberEdits();beforeEdits={...worldEdits};setEditMode(true)};\n$('#saveworld').onclick=()=>{rememberEdits();try{localStorage.setItem('trinity-world-edits',JSON.stringify(worldEdits));setEditMode(false);$('#editnotice').textContent='이 브라우저에 저장했습니다. 전체 백업으로 별도 보관할 수 있어요.'}catch{alert('저장할 수 없습니다. 전체 백업으로 내용을 보관해 주세요.')}};\n$('#cancelworld').onclick=()=>{worldEdits={...beforeEdits};setEditMode(false)};\nwindow.addEventListener('beforeunload',e=>{if(worldEditing){e.preventDefault();e.returnValue=''}});\n$('#backupall').onclick=()=>{const values={...worldEdits};if(worldEditing)for(const n of document.querySelectorAll('[data-edit-key]'))values[n.dataset.editKey]=n.innerText;const url=URL.createObjectURL(new Blob([JSON.stringify({world:'Trinity Nexus',version:3,edits:values,characters:chars,personnel:JSON.parse(localStorage.getItem('trinity-nexus-archive-v1')||'null')},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='Trinity_Nexus_full_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};\n$('#restoreall').onclick=()=>$('#fullbackup').click();$('#fullbackup').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const d=JSON.parse(await f.text());if(d.world!=='Trinity Nexus'||!d.edits||Array.isArray(d.edits)||typeof d.edits!=='object'||!Object.values(d.edits).every(v=>typeof v==='string')||!Array.isArray(d.characters)||!d.characters.every(c=>c&&typeof c.name==='string'&&schools.some(s=>s.name===c.school)))throw Error();if(!confirm('현재 세계관과 인물 기록을 백업 내용으로 교체할까요?'))return;if(d.personnel){const roster=document.querySelector('iframe').contentWindow;if(!roster.valid(d.personnel))throw Error()}const oldWorld=localStorage.getItem('trinity-world-edits'),oldChars=localStorage.getItem('trinity-characters'),oldPersonnel=localStorage.getItem('trinity-nexus-archive-v1');try{localStorage.setItem('trinity-world-edits',JSON.stringify(d.edits));localStorage.setItem('trinity-characters',JSON.stringify(d.characters));if(d.personnel)localStorage.setItem('trinity-nexus-archive-v1',JSON.stringify(d.personnel))}catch(err){if(oldWorld===null)localStorage.removeItem('trinity-world-edits');else localStorage.setItem('trinity-world-edits',oldWorld);if(oldChars===null)localStorage.removeItem('trinity-characters');else localStorage.setItem('trinity-characters',oldChars);if(oldPersonnel===null)localStorage.removeItem('trinity-nexus-archive-v1');else localStorage.setItem('trinity-nexus-archive-v1',oldPersonnel);throw err}worldEditing=false;location.reload()}catch{alert('복원할 수 없습니다. 올바른 전체 백업 파일인지, 브라우저 저장 공간이 충분한지 확인해 주세요.')}e.target.value=''};\napplyWorldEdits();\n\n\u003c/script>\u003cscript>\nconst schoolIds=['union','arcadia','nocturne','zenith'];document.querySelectorAll('#schools .academy').forEach((e,i)=>{e.dataset.schoolCard=schoolIds[i];if(schoolIds[i]==='zenith'){e.classList.add('public-agency');e.setAttribute('aria-label','아카데미와 별도의 공공기관 제니스특수청')};const art=document.createElement('div');art.className='academy-art';art.innerHTML='\u003cdiv class=\"geo\" data-geometry=\"'+schoolIds[i]+'\">\u003c/div>';e.prepend(art);art.style.cursor='pointer';art.style.pointerEvents='auto';art.setAttribute('role','link');art.tabIndex=0;art.setAttribute('aria-label',schools[i].name+' 설명 보기');art.onclick=()=>{if(!document.body.classList.contains('editing'))window.navigateSingle(schoolIds[i]==='zenith'?'agency.html':'academy.html?school='+schoolIds[i])};art.onkeydown=ev=>{if(ev.key==='Enter')art.click()};const a=document.createElement('a');a.className='school-link';a.href=schoolIds[i]==='zenith'?'agency.html':'academy.html?school='+schoolIds[i];a.textContent=schoolIds[i]==='zenith'?'제니스특수청 설명':'아카데미 설명 페이지';e.append(a)});TrinityUI.apply('world');document.getElementById('designworld').onclick=()=>TrinityUI.open('world');document.getElementById('backupall').onclick=()=>TrinityUI.backup();document.getElementById('fullbackup').onchange=e=>{if(e.target.files[0])TrinityUI.restore(e.target.files[0])};\n\u003c/script>\u003c/body>\u003c/html>\n","academy":"\u003c!DOCTYPE html>\u003chtml lang=\"ko\">\u003chead>\u003cscript>window.TRINITY_CAN_EDIT=__TRINITY_EDIT_FLAG__;\u003c/script>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta tom:8px}.meta strong{font-size:16px;font-weight:400}.editorbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:25px 0}.hint{font-size:13px;color:var(--muted)}.article-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.article{border:1px solid var(--line);background:linear-gradient(130deg,#ffffff03,transparent),var(--panel);padding:32px;border-radius:16px;position:relative}.article.full{grid-column:1/-1}.article h3{font-size:24px;font-weight:500;margin:8px 0 18px}.article p{font-size:16px;line-height:2;color:var(--muted);white-space:pre-wrap;margin:0;overflow-wrap:anywhere}.sectionlabel{color:var(--accent);font-size:11px;letter-spacing:3px}.cta{margin:55px 0;padding:40px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(110deg,var(--glow),transparent)}.cta h3{font:36px Georgia;margin:0 0 15px}.cta p{color:var(--muted);margin-bottom:25px}.footer{border-top:1px solid var(--line);padding:25px 0 40px;color:var(--muted);font-size:11px;letter-spacing:2px}.editing [data-field]{outline:1px dashed var(--accent);outline-offset:6px;cursor:text;min-height:24px}.editing [data-field]:focus{background:var(--glow);outline:2px solid var(--accent)}[hidden]{display:none!important}.sectiontools{display:flex;gap:8px;margin-top:20px}.sectiontools button{font-size:13px}.delete{color:var(--muted)}.editor-note{border-left:2px solid var(--accent);padding-left:15px;font-size:14px;color:var(--muted);margin-bottom:30px}@media(max-width:700px){.shell{padding:0 22px}.top .shell{display:block}.nav{margin-top:15px;flex-wrap:wrap}.schoolnav{gap:20px}.hero{min-height:490px;padding-top:40px}.hero h1{font-size:66px;letter-spacing:-3px}.hero .geometry-art{right:-200px;top:80px;opacity:.35}.hero p{max-width:90%;font-size:16px}.meta-grid{grid-template-columns:1fr;margin-top:22px;gap:1px}.meta{padding:18px 23px}.meta small{display:inline-block;margin:0 15px 0 0;min-width:85px}.article-grid{grid-template-columns:1fr}.article{padding:26px}.article.full{grid-column:auto}.cta{padding:28px}.cta h3{font-size:30px}}\n\u003c/style>\u003cscript>\nwindow.navigateSingle=href=>parent.postMessage({type:'trinity-navigate',href},'*');\ndocument.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');if(!h||h.startsWith('blob:')||a.hasAttribute('download'))return;if(h.startsWith('#')){e.preventDefault();const target=document.getElementById(h.slice(1));if(target)target.scrollIntoView({behavior:'smooth'});return;}if(h==='./'||h==='index.html'||/^(academy|agency|personnel)\\.html(?:\\?|$)/.test(h)){e.preventDefault();window.navigateSingle(h)}},true);\n\u003c/script>\u003cscript>document.addEventListener('click',e=>{if(window.TRINITY_CAN_EDIT)return;const selector='#editmode,#saveworld,#cancelworld,#designworld,#backupall,#restoreall,#edit,#save,#cancel,#add,#backup,#restore,#design,#themeBtn,#completeBackup,#download,.section-head>button,.placeholder,.sectiontools,.edit-person,.remove,.dossier-layout button.primary';if(e.target.closest(selector)){e.preventDefault();e.stopImmediatePropagation();parent.postMessage({type:'trinity-code-required'},'*')}},true);\u003c/script>\u003c/head>\u003cbody data-owner=\"__TRINITY_OWNER__\">\u003cheader class=\"top\">\u003cdiv class=\"shell\">\u003ca class=\"brand\" href=\"./\">TRINITY NEXUS\u003csmall>ACADEMIES & PUBLIC INSTITUTION\u003c/small>\u003c/a>\u003cnav class=\"nav\">\u003ca href=\"./\">세계관 홈\u003c/a>\u003ca id=\"rosterTop\" href=\"personnel.html\">인명록\u003c/a>\u003cbutton class=\"btn\" id=\"design\">색상·무늬 편집\u003c/button>\u003c/nav>\u003c/div>\u003c/header>\u003cmain class=\"shell\">\u003cnav class=\"schoolnav\" id=\"schoolnav\" aria-label=\"아카데미 및 기관 선택\">\u003c/nav>\u003cdiv class=\"editorbar\">\u003cbutton class=\"btn\" id=\"edit\">설명 편집\u003c/button>\u003cbutton class=\"btn\" id=\"save\" hidden>변경 저장\u003c/button>\u003cbutton class=\"btn\" id=\"cancel\" hidden>취소\u003c/button>\u003cbutton class=\"btn\" id=\"add\" hidden>설명 항목 추가\u003c/button>\u003cbutton class=\"btn\" id=\"backup\">전체 백업\u003c/button>\u003cbutton class=\"btn\" id=\"restore\">백업 복원\u003c/button>\u003cinput id=\"import\" type=\"file\" accept=\"application/json\" hidden>\u003cspan class=\"hint\" id=\"status\">설정과 디자인은 현재 브라우저에 저장됩니다.\u003c/span>\u003c/div>\u003cdiv class=\"hero\">\u003cdiv class=\"geometry-art geo\" data-geometry=\"active\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"hero-copy\">\u003cdiv class=\"eyebrow\" data-field=\"realm\">\u003c/div>\u003ch1 data-field=\"en\">\u003c/h1>\u003ch2 data-field=\"name\">\u003c/h2>\u003cp data-field=\"lead\">\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"meta-grid\">\u003cdiv class=\"meta\">\u003csmall>REALM\u003c/small>\u003cstrong data-field=\"location\">\u003c/strong>\u003c/div>\u003cdiv class=\"meta\">\u003csmall>SYMBOL\u003c/small>\u003cstrong data-field=\"flower\">\u003c/strong>\u003c/div>\u003cdiv class=\"meta\">\u003csmall>COLORS\u003c/small>\u003cstrong data-field=\"colors\">\u003c/strong>\u003c/div>\u003c/div>\u003cdiv class=\"editor-note\" id=\"note\" hidden>점선으로 표시된 글을 클릭해서 수정하세요. 항목을 추가하거나 순서를 바꿀 수도 있습니다.\u003c/div>\u003cdiv class=\"article-grid\" id=\"articles\">\u003c/div>\u003cdiv class=\"cta\">\u003cdiv class=\"eyebrow\">PERSONNEL ARCHIVE\u003c/div>\u003ch3>Every name, a story.\u003c/h3>\u003cp>이 아카데미에 속한 인물들의 사진과 설정, 관계를 기록하세요.\u003c/p>\u003ca class=\"btn\" id=\"rosterBottom\">이 아카데미 인명록 열기\u003c/a>\u003c/div>\u003cfooter class=\"footer\">TRINITY NEXUS / THREE WORLDS, COUNTLESS STORIES\u003c/footer>\u003c/main>\u003cscript>\nconst defaults={\"union\":{\"en\":\"Central Union\",\"name\":\"센트럴 유니온 아카데미\",\"realm\":\"HUMAN REALM / THE CROSSROADS\",\"location\":\"인간계 · 세 세계의 중심\",\"flower\":\"코스모스\",\"colors\":\"블랙 × 화이트\",\"lead\":\"인간·요정·드워프가 함께 살아가는 가장 큰 세계.\\n세계를 잇는 중심이자, 압도적인 규모로 교류와 행사를 이끄는 아카데미.\",\"sections\":[[\"WORLD\",\"가장 넓은 세계, 교류의 중심\",\"센트럴 유니온은 세계를 잇는 중심이며, 세 세계 가운데 가장 큰 규모를 지닌다. 대표적인 종족은 인간·요정족·드워프다. 다양한 종족이 함께 살아가며, 용족은 드물게 존재하지만 특정 세계 한곳에만 속하지 않는다.\"],[\"ACADEMY\",\"모든 길이 모이는 아카데미\",\"센트럴 유니온 아카데미는 다른 세계의 아카데미에 비해 압도적인 규모를 자랑한다. 지리적 이점과 시설 규모, 많은 인원 덕분에 대부분의 대규모 행사와 교류가 이곳에서 열린다.\"],[\"IDENTITY\",\"질서와 조화의 코스모스\",\"상징색은 검은색과 흰색, 상징꽃은 코스모스. 코스모스는 질서·조화·우주를 뜻하며 혼돈과 대립한다. 학교의 상징색과 꽃 엠블럼을 담은 제복을 착용한다.\"],[\"PRIME\",\"학생회이자 정예부대\",\"프라임은 아카데미의 학생회 역할을 수행하는 동시에, 학교를 대표하는 정예부대다. 별도의 엑스큐터 학생회장이나 아키텍트 학생회장은 두지 않는다.\"],[\"PERSONNEL\",\"아카데미의 인물 구성\",\"학장(제n대), 교수, 프라임, 전투집행부 학생과 전술통제부 학생으로 구성한다. 프라임 내부의 세부 직책과 팀·페어는 인물별로 기록할 수 있다.\"],[\"EDUCATION\",\"기초 교육 이후의 진학\",\"초·중·고 기관에서 기본 마법을 배우는 기초 교육을 받은 이후 아카데미에 입학할 수 있다. 아카데미에 입학하지 않고 일반인으로 살아갈 경우에는 공격 마법의 대부분이 제한되며, 생활 마법과 기초 마법을 활용해 살아간다.\"]]},\"arcadia\":{\"en\":\"Arcadia\",\"name\":\"아르카디아 아카데미\",\"realm\":\"CELESTIAL REALM / HONOR & ORDER\",\"location\":\"천계\",\"flower\":\"백합\",\"colors\":\"로열 블루 × 실버\",\"lead\":\"규율과 전통, 권위가 깊이 뿌리내린 천계의 아카데미.\\n오래된 혈통의 질서와 변화를 향한 의지가 교차한다.\",\"sections\":[[\"ACADEMY\",\"규율과 권위를 중시하는 전당\",\"아르카디아는 천계의 아카데미로, 규율과 질서를 중시한다. 하계와의 단순한 라이벌 관계보다는 오래 축적된 권위적인 문화와 위계가 사회 분위기에 큰 영향을 미친다.\"],[\"HERITAGE\",\"오래된 선민의식의 잔재\",\"과거 천족의 혈통과 신성성이 다른 종족보다 우월한 지위를 부여한다는 관념이 사회의 위계와 권위를 정당화했다. 그 질서가 오래 유지된 탓에, 오늘날에도 일부 가문·교수·관료 사이에는 출신 종족을 능력과 품격의 기준으로 삼는 태도가 남아 있다.\\n\\n이는 모든 천족이 같은 편견을 지녔다는 뜻이 아니다. 전통을 지키려는 이들과 낡은 차별을 바꾸려는 이들이 공존하며, 그 차이가 아카데미 안의 갈등으로 이어질 수 있다.\"],[\"IDENTITY\",\"푸른 질서, 은빛 백합\",\"상징색은 로열 블루와 실버, 상징꽃은 백합. 학교의 상징색과 꽃 엠블럼을 담은 제복을 착용한다.\"],[\"PRIME\",\"학생회이자 정예부대\",\"프라임은 학생회 역할을 수행하면서 학교를 대표하는 정예부대로 활동한다. 별도의 계열별 학생회장 직책은 두지 않는다.\"],[\"PERSONNEL\",\"아카데미의 인물 구성\",\"학장(제n대), 교수, 프라임, 전투집행부 학생과 전술통제부 학생으로 구성한다. 유학생 제도 등 추가 설정은 아직 확정하지 않았다.\"],[\"EDUCATION\",\"기초 교육 이후의 진학\",\"초·중·고 기관에서 기본 마법을 배우는 기초 교육을 받은 이후 아카데미에 입학할 수 있다. 아카데미에 입학하지 않고 일반인으로 살아갈 경우에는 공격 마법의 대부분이 제한되며, 생활 마법과 기초 마법을 활용해 살아간다.\"]]},\"nocturne\":{\"en\":\"Nocturne\",\"name\":\"녹턴 아카데미\",\"realm\":\"LOWER REALM / THE ETERNAL SUNSET\",\"location\":\"하계 · 세 세계의 가장 하층\",\"flower\":\"글라디올러스\",\"colors\":\"다크 레드 × 다크 그레이\",\"lead\":\"세계의 가장 아래, 닫힌 경계와 노을 아래의 아카데미.\\n마족과 수인, 다른 세계를 떠난 자들의 사정이 겹쳐진다.\",\"sections\":[[\"WORLD\",\"가장 하층에 놓인 세계\",\"녹턴이 자리한 하계는 세 세계의 가장 하층에 위치한다. 대표적인 종족으로 마족과 수인족 등이 있다. 푸른 하늘 대신 노을진 하늘이 펼쳐지며, 외부를 향해 자유롭게 열린 사회가 아니라 폐쇄적인 분위기를 지닌다.\"],[\"SOCIETY\",\"경계 너머에서 온 자들\",\"인간계나 천계에서 도망쳐 이곳에 이르는 이들도 있다. 이들의 사정과 출신은 제각각이며, 하계 전체나 특정 종족을 범죄자 집단으로 취급하지 않는다. 닫힌 사회의 내부 질서와 외부에서 유입된 삶들이 함께 존재한다.\"],[\"IDENTITY\",\"짙은 붉음, 글라디올러스\",\"상징색은 다크 레드와 다크 그레이, 상징꽃은 글라디올러스. 학교의 상징색과 꽃 엠블럼을 담은 제복을 착용한다.\"],[\"PRIME\",\"공적인 정예와 비밀의 경계\",\"녹턴의 프라임 역시 학생회 역할을 겸하는 정예부대다. 그러나 비밀 암살부대 이클립스 소속은 프라임이 될 수 없다. 두 조직의 소속과 역할은 구분된다.\"],[\"ECLIPSE\",\"알려지지 않은 필요악\",\"이클립스는 녹턴 내부에서도 존재를 쉽게 알 수 없는 비밀 암살부대다. 제니스특수청이 절대선의 공공기관으로 남아야 하기에, 이클립스는 그와 대조되는 필요악의 역할을 맡는다. 위험인물과 배신자를 제거하며 공개적인 전면전과 구분되는 은밀한 임무를 수행한다.\\n\\n이러한 역할의 대조가 두 조직의 공식 지휘·위탁 관계를 뜻하는 것은 아니다. 구체적인 조직 간 관계는 아직 정하지 않았다.\"],[\"COMMAND\",\"이클립스의 리더와 대원\",\"이클립스는 부대를 이끄는 리더와 그 아래 대원들로 구성된다. 부대원은 대부분 수인이며, 암살에 특화된 존재들이 많다. 모든 대원을 수인으로 한정하지는 않는다.\"],[\"PERSONNEL\",\"아카데미와 이클립스의 인명록\",\"학장·교수·프라임·전투집행부 학생·전술통제부 학생을 기록한다. 이클립스는 별도 분류로 리더와 대원을 기록하며, 프라임 분류와 겹치지 않는다.\"],[\"EDUCATION\",\"기초 교육 이후의 진학\",\"초·중·고 기관에서 기본 마법을 배우는 기초 교육을 받은 이후 아카데미에 입학할 수 있다. 아카데미에 입학하지 않고 일반인으로 살아갈 경우에는 공격 마법의 대부분이 제한되며, 생활 마법과 기초 마법을 활용해 살아간다.\"]]},\"zenith\":{\"en\":\"Zenith\",\"name\":\"제니스특수청\",\"realm\":\"PUBLIC INSTITUTION / THE HIGHEST STANDARD\",\"location\":\"위치 비공개 · 특수 게이트\",\"flower\":\"에델바이스\",\"colors\":\"퓨어 화이트 × 골드\",\"lead\":\"국가가 설립한 최정예 의회기관.\\n가장 위험한 현장에 투입되어 생명을 지키고, 착취당하는 약자를 보호한다.\",\"sections\":[[\"INSTITUTION\",\"국가가 만든 최정예 공공기관\",\"제니스특수청은 아카데미가 아니라 국가가 설립한 최정예 의회기관이다. 공공기관으로서 절대선의 존재로 남아야 하며, 세 세계의 위험한 현장과 위협에 대응한다.\"],[\"RECRUITMENT\",\"접촉과 선발 시험\",\"각 아카데미의 졸업생들이 모이는 교육기관이 아니다. 뛰어난 역량을 보이는 최정예 아카데미생에게 직접 접촉해 영입하거나, 인원을 모집하는 선발 시험을 치른다. 구체적인 시험 주기와 지원 요건은 미정이다.\"],[\"OUTER RESPONSE\",\"가장 위험한 아우터의 토벌\",\"가장 위험한 아우터를 상대하는 토벌 임무를 수행한다. 최정예 전력과 전문 인력을 위험한 현장에 투입한다.\"],[\"PUBLIC SERVICE\",\"현장 대응과 약자 보호\",\"위험한 현장에서 공공의 안전을 지키는 역할과, 착취당하는 약자를 보호하는 역할을 담당하는 부서가 있다. 부서별 세부 명칭과 조직도는 아직 확정하지 않았다.\"],[\"ORGANIZATION\",\"프라임 대신 부서 체계\",\"제니스특수청에는 프라임이 없다. 인원은 부서에 소속되며, 인명록에서 부서명과 세부 직책을 자유롭게 기록할 수 있다. 기존 아카데미식 학장·교수·학생회 조직은 적용하지 않는다.\"],[\"IDENTITY\",\"순백과 금빛 에델바이스\",\"상징색은 퓨어 화이트와 골드, 상징꽃은 에델바이스. 제복을 착용한다.\"],[\"CONTRAST\",\"빛 아래의 제니스, 그림자의 이클립스\",\"제니스특수청은 절대선의 존재로서 공적인 보호와 대응을 수행한다. 이클립스는 위험인물과 배신자를 은밀하게 제거하는 필요악이다. 역할은 대조되지만, 서로의 공식 소속·지휘·의뢰 관계는 별도로 정해지지 않았다.\"],[\"INVESTIGATION\",\"숨은 불법 조직의 조사와 제압\",\"제니스특수청에는 신디케이트 등 불법 조직을 조사하고 제압·해체하려는 담당 부서가 있다. 인신매매·불법 경매·수인 및 희귀 종족 투기장·생체 실험 등이 조사 대상이다. 부서명은 아직 확정하지 않았다.\"]]}};\nconst $=s=>document.querySelector(s),id=Object.hasOwn(defaults,'__TRINITY_SCHOOL__')?'__TRINITY_SCHOOL__':'union';let all={};try{all=JSON.parse(localStorage.getItem('trinity-academies-v1')||'{}')}catch{}let record=structuredClone(all[id]||defaults[id]),editing=false,before;for(const item of defaults[id].sections.filter(v=>['EDUCATION','INVESTIGATION'].includes(v[0])))if(!record.sections.some(v=>v[0]===item[0]))record.sections.push(structuredClone(item));document.title=record.name+' · Trinity Nexus';const names={union:'유니온',arcadia:'아르카디아',nocturne:'녹턴',zenith:'제니스특수청'};for(const [k,v] of Object.entries(names)){const a=document.createElement('a');a.href=k==='zenith'?'agency.html':'academy.html?school='+k;a.textContent=v;a.classList.toggle('active',k===id);$('#schoolnav').append(a)}for(const el of [$('#rosterTop'),$('#rosterBottom')])el.href='personnel.html?school='+id;\nfunction render(){for(const e of document.querySelectorAll('[data-field]'))e.textContent=record[e.dataset.field]||'';$('#articles').replaceChildren();record.sections.forEach((s,i)=>{const a=document.createElement('article');a.className='article'+(s[2].length>200?' full':'');for(const [tag,cls,index] of [['div','sectionlabel',0],['h3','',1],['p','',2]]){const n=document.createElement(tag);n.className=cls;n.textContent=s[index]||'';n.dataset.section=i;n.dataset.part=index;if(editing){n.contentEditable='plaintext-only';n.dataset.field='section'}a.append(n)}if(editing){const t=document.createElement('div');t.className='sectiontools';for(const [label,action] of [['앞으로',()=>{if(i>0)[record.sections[i-1],record.sections[i]]=[record.sections[i],record.sections[i-1]]}],['뒤로',()=>{if(i\u003crecord.sections.length-1)[record.sections[i+1],record.sections[i]]=[record.sections[i],record.sections[i+1]]}],['항목 삭제',()=>{if(confirm('이 설명 항목을 삭제할까요?'))record.sections.splice(i,1)}]]){const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=()=>{capture();action();render()};t.append(b)}a.append(t)}$('#articles').append(a)});document.body.classList.toggle('editing',editing);for(const n of document.querySelectorAll('[data-field]'))n.contentEditable=editing?'plaintext-only':'false';for(const k of ['save','cancel','add','note'])$('#'+k).hidden=!editing;$('#edit').hidden=editing}\nfunction capture(){for(const n of document.querySelectorAll('[data-field]')){if(n.dataset.field==='section')record.sections[Number(n.dataset.section)][Number(n.dataset.part)]=n.innerText;else record[n.dataset.field]=n.innerText}}\n$('#edit').onclick=()=>{before=structuredClone(record);editing=true;render()};$('#cancel').onclick=()=>{record=before;editing=false;render()};$('#save').onclick=()=>{capture();all[id]=record;try{localStorage.setItem('trinity-academies-v1',JSON.stringify(all));editing=false;render();TrinityUI.notify('아카데미 설명을 저장했어요.')}catch{TrinityUI.notify('저장하지 못했습니다. 백업과 저장 공간을 확인해 주세요.')}};$('#add').onclick=()=>{capture();record.sections.push(['NEW RECORD','새 설명 항목','이곳에 내용을 입력하세요.']);render()};$('#design').onclick=()=>TrinityUI.open(id);$('#backup').onclick=()=>TrinityUI.backup();$('#restore').onclick=()=>$('#import').click();$('#import').onchange=e=>{if(e.target.files[0])TrinityUI.restore(e.target.files[0])};window.addEventListener('beforeunload',e=>{if(editing){e.preventDefault();e.returnValue=''}});if(id==='zenith'){$('#rosterBottom').textContent='제니스특수청 인명록 열기';document.querySelector('.cta p').textContent='특수청 소속 인물의 부서·직책·능력과 관계를 기록하세요.'}render();TrinityUI.apply(id);\n\u003c/script>\u003c/body>\u003c/html>\n","agency":"\u003c!DOCTYPE html>\u003chtml lang=\"ko\">\u003chead>\u003cscript>window.TRINITY_CAN_EDIT=__TRINITY_EDIT_FLAG__;\u003c/script>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"description\" content=\"트리니티 넥서스 아카데미 소개와 설정 기록\">\u003ctitle>아카데미 기록 · Trinity Nexus\u003c/title>\u003cstyle>__TRINITY_CSS__\u003c/style>\u003cscript>__TRINITY_JS__\u003c/script>\u003cstyle>\n*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.shell{max-width:1180px;margin:auto;padding:0 40px}.top{border-bottom:1px solid var(--line);padding:23px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);position:relative;z-index:2}.top .shell{display:flex;justify-content:space-between;gap:25px;align-items:center}.brand{font:20px Georgia;letter-spacing:4px}.brand small{display:block;font:10px/2.5 system-ui;letter-spacing:3px;color:var(--muted)}.nav{display:flex;gap:12px;align-items:center}.nav a,.btn{display:inline-block;font-size:14px;border:1px solid var(--line);padding:8px 14px;border-radius:7px;background:var(--panel);color:var(--text);cursor:pointer}.schoolnav{display:flex;gap:24px;overflow:auto;padding:27px 0;border-bottom:1px solid var(--line)}.schoolnav a{font-size:14px;color:var(--muted);white-space:nowrap}.schoolnav a.active{color:var(--accent)}.hero{position:relative;min-height:525px;padding:70px 0 55px;overflow:hidden;border-bottom:1px solid var(--line)}.hero .geometry-art{width:510px;height:510px;right:-30px;top:0;opacity:.7}.hero-copy{position:relative;z-index:1;max-width:670px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--accent)}h1{font:clamp(65px,8vw,104px)/1.05 Georgia;letter-spacing:-4px;margin:30px 0 20px;overflow-wrap:anywhere}h2{font-size:23px;font-weight:400;margin:12px 0 20px}.hero p{max-width:560px;color:var(--muted);font-size:17px;line-height:2;white-space:pre-wrap}.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:35px 0 55px;border-radius:12px;overflow:hidden}.meta{padding:24px;background:var(--panel)}.meta small{display:block;font-size:11px;letter-spacing:2px;color:var(--accent);margin-bottom:8px}.meta strong{font-size:16px;font-weight:400}.editorbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:25px 0}.hint{font-size:13px;color:var(--muted)}.article-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.article{border:1px solid var(--line);background:linear-gradient(130deg,#ffffff03,transparent),var(--panel);padding:32px;border-radius:16px;position:relative}.article.full{grid-column:1/-1}.article h3{font-size:24px;font-weight:500;margin:8px 0 18px}.article p{font-size:16px;line-height:2;color:var(--muted);white-space:pre-wrap;margin:0;overflow-wrap:anywhere}.sectionlabel{color:var(--accent);font-size:11px;letter-spacing:3px}.cta{margin:55px 0;padding:40px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(110deg,var(--glow),transparent)}.cta h3{font:36px Georgia;margin:0 0 15px}.cta p{color:var(--muted);margin-bottom:25px}.footer{border-top:1px solid var(--line);padding:25px 0 40px;color:var(--muted);font-size:11px;letter-spacing:2px}.editing [data-field]{outline:1px dashed var(--accent);outline-offset:6px;cursor:text;min-height:24px}.editing [data-field]:focus{background:var(--glow);outline:2px solid var(--accent)}[hidden]{display:none!important}.sectiontools{display:flex;gap:8px;margin-top:20px}.sectiontools button{font-size:13px}.delete{color:var(--muted)}.editor-note{border-left:2px solid var(--accent);padding-left:15px;font-size:14px;color:var(--muted);margin-bottom:30px}@media(max-width:700px){.shell{padding:0 22px}.top .shell{display:block}.nav{margin-top:15px;flex-wrap:wrap}.schoolnav{gap:20px}.hero{min-height:490px;padding-top:40px}.hero h1{font-size:66px;letter-spacing:-3px}.hero .geometry-art{right:-200px;top:80px;opacity:.35}.hero p{max-width:90%;font-size:16px}.meta-grid{grid-template-columns:1fr;margin-top:22px;gap:1px}.meta{padding:18px 23px}.meta small{display:inline-block;margin:0 15px 0 0;min-width:85px}.article-grid{grid-template-columns:1fr}.article{padding:26px}.article.full{grid-column:auto}.cta{padding:28px}.cta h3{font-size:30px}}\n\u003c/style>\u003cscript>\nwindow.navigateSingle=href=>parent.postMessage({type:'trinity-navigate',href},'*');\ndocument.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');if(!h||h.startsWith('blob:')||a.hasAttribute('download'))return;if(h.startsWith('#')){e.preventDefault();const target=document.getElementById(h.slice(1));if(target)target.scrollIntoView({behavior:'smooth'});return;}if(h==='./'||h==='index.html'||/^(academy|agency|personnel)\\.html(?:\\?|$)/.test(h)){e.preventDefault();window.navigateSingle(h)}},true);\n\u003c/script>\u003cscript>document.addEventListener('click',e=>{if(window.TRINITY_CAN_EDIT)return;const selector='#editmode,#saveworld,#cancelworld,#designworld,#backupall,#restoreall,#edit,#save,#cancel,#add,#backup,#restore,#design,#themeBtn,#completeBackup,#download,.section-head>button,.placeholder,.sectiontools,.edit-person,.remove,.dossier-layout button.primary';if(e.target.closest(selector)){e.preventDefault();e.stopImmediatePropagation();parent.postMessage({type:'trinity-code-required'},'*')}},true);\u003c/script>\u003c/head>\u003cbody data-owner=\"__TRINITY_OWNER__\">\u003cheader class=\"top\">\u003cdiv class=\"shell\">\u003ca class=\"brand\" href=\"./\">TRINITY NEXUS\u003csmall>ACADEMIES & PUBLIC INSTITUTION\u003c/small>\u003c/a>\u003cnav class=\"nav\">\u003ca href=\"./\">세계관 홈\u003c/a>\u003ca id=\"rosterTop\" href=\"personnel.html\">인명록\u003c/a>\u003cbutton class=\"btn\" id=\"design\">색상·무늬 편집\u003c/button>\u003c/nav>\u003c/div>\u003c/header>\u003cmain class=\"shell\">\u003cnav class=\"schoolnav\" id=\"schoolnav\" aria-label=\"아카데미 및 기관 선택\">\u003c/nav>\u003cdiv class=\"editorbar\">\u003cbutton class=\"btn\" id=\"edit\">설명 편집\u003c/button>\u003cbutton class=\"btn\" id=\"save\" hidden>변경 저장\u003c/button>\u003cbutton class=\"btn\" id=\"cancel\" hidden>취소\u003c/button>\u003cbutton class=\"btn\" id=\"add\" hidden>설명 항목 추가\u003c/button>\u003cbutton class=\"btn\" id=\"backup\">전체 백업\u003c/button>\u003cbutton class=\"btn\" id=\"restore\">백업 복원\u003c/button>\u003cinput id=\"import\" type=\"file\" accept=\"application/json\" hidden>\u003cspan class=\"hint\" id=\"status\">설정과 디자인은 현재 브라우저에 저장됩니다.\u003c/span>\u003c/div>\u003cdiv class=\"hero\">\u003cdiv class=\"geometry-art geo\" data-geometry=\"active\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"hero-copy\">\u003cdiv class=\"eyebrow\" data-field=\"realm\">\u003c/div>\u003ch1 data-field=\"en\">\u003c/h1>\u003ch2 data-field=\"name\">\u003c/h2>\u003cp data-field=\"lead\">\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"meta-grid\">\u003cdiv class=\"meta\">\u003csmall>REALM\u003c/small>\u003cstrong data-field=\"location\">\u003c/strong>\u003c/div>\u003cdiv class=\"meta\">\u003csmall>SYMBOL\u003c/small>\u003cstrong data-field=\"flower\">\u003c/strong>\u003c/div>\u003cdiv class=\"meta\">\u003csmall>COLORS\u003c/small>\u003cstrong data-field=\"colors\">\u003c/strong>\u003c/div>\u003c/div>\u003cdiv class=\"editor-note\" id=\"note\" hidden>점선으로 표시된 글을 클릭해서 수정하세요. 항목을 추가하거나 순서를 바꿀 수도 있습니다.\u003c/div>\u003cdiv class=\"article-grid\" id=\"articles\">\u003c/div>\u003cdiv class=\"cta\">\u003cdiv class=\"eyebrow\">PERSONNEL ARCHIVE\u003c/div>\u003ch3>Every name, a story.\u003c/h3>\u003cp>특수청 소속 인물의 부서·직책·능력과 관계를 기록하세요.\u003c/p>\u003ca class=\"btn\" id=\"rosterBottom\">제니스특수청 인명록 열기\u003c/a>\u003c/div>\u003cfooter class=\"footer\">TRINITY NEXUS / THREE WORLDS, COUNTLESS STORIES\u003c/footer>\u003c/main>\u003cscript>\nconst defaults={\"union\":{\"en\":\"Central Union\",\"name\":\"센트럴 유니온 아카데미\",\"realm\":\"HUMAN REALM / THE CROSSROADS\",\"location\":\"인간계 · 세 세계의 중심\",\"flower\":\"코스모스\",\"colors\":\"블랙 × 화이트\",\"lead\":\"인간·요정·드워프가 함께 살아가는 가장 큰 세계.\\n세계를 잇는 중심이자, 압도적인 규모로 교류와 행사를 이끄는 아카데미.\",\"sections\":[[\"WORLD\",\"가장 넓은 세계, 교류의 중심\",\"센트럴 유니온은 세계를 잇는 중심이며, 세 세계 가운데 가장 큰 규모를 지닌다. 대표적인 종족은 인간·요정족·드워프다. 다양한 종족이 함께 살아가며, 용족은 드물게 존재하지만 특정 세계 한곳에만 속하지 않는다.\"],[\"ACADEMY\",\"모든 길이 모이는 아카데미\",\"센트럴 유니온 아카데미는 다른 세계의 아카데미에 비해 압도적인 규모를 자랑한다. 지리적 이점과 시설 규모, 많은 인원 덕분에 대부분의 대규모 행사와 교류가 이곳에서 열린다.\"],[\"IDENTITY\",\"질서와 조화의 코스모스\",\"상징색은 검은색과 흰색, 상징꽃은 코스모스. 코스모스는 질서·조화·우주를 뜻하며 혼돈과 대립한다. 학교의 상징색과 꽃 엠블럼을 담은 제복을 착용한다.\"],[\"PRIME\",\"학생회이자 정예부대\",\"프라임은 아카데미의 학생회 역할을 수행하는 동시에, 학교를 대표하는 정예부대다. 별도의 엑스큐터 학생회장이나 아키텍트 학생회장은 두지 않는다.\"],[\"PERSONNEL\",\"아카데미의 인물 구성\",\"학장(제n대), 교수, 프라임, 전투집행부 학생과 전술통제부 학생으로 구성한다. 프라임 내부의 세부 직책과 팀·페어는 인물별로 기록할 수 있다.\"],[\"EDUCATION\",\"기초 교육 이후의 진학\",\"초·중·고 기관에서 기본 마법을 배우는 기초 교육을 받은 이후 아카데미에 입학할 수 있다. 아카데미에 입학하지 않고 일반인으로 살아갈 경우에는 공격 마법의 대부분이 제한되며, 생활 마법과 기초 마법을 활용해 살아간다.\"]]},\"arcadia\":{\"en\":\"Arcadia\",\"name\":\"아르카디아 아카데미\",\"realm\":\"CELESTIAL REALM / HONOR & ORDER\",\"location\":\"천계\",\"flower\":\"백합\",\"colors\":\"로열 블루 × 실버\",\"lead\":\"규율과 전통, 권위가 깊이 뿌리내린 천계의 아카데미.\\n오래된 혈통의 질서와 변화를 향한 의지가 교차한다.\",\"sections\":[[\"ACADEMY\",\"규율과 권위를 중시하는 전당\",\"아르카디아는 천계의 아카데미로, 규율과 질서를 중시한다. 하계와의 단순한 라이벌 관계보다는 오래 축적된 권위적인 문화와 위계가 사회 분위기에 큰 영향을 미친다.\"],[\"HERITAGE\",\"오래된 선민의식의 잔재\",\"과거 천족의 혈통과 신성성이 다른 종족보다 우월한 지위를 부여한다는 관념이 사회의 위계와 권위를 정당화했다. 그 질서가 오래 유지된 탓에, 오늘날에도 일부 가문·교수·관료 사이에는 출신 종족을 능력과 품격의 기준으로 삼는 태도가 남아 있다.\\n\\n이는 모든 천족이 같은 편견을 지녔다는 뜻이 아니다. 전통을 지키려는 이들과 낡은 차별을 바꾸려는 이들이 공존하며, 그 차이가 아카데미 안의 갈등으로 이어질 수 있다.\"],[\"IDENTITY\",\"푸른 질서, 은빛 백합\",\"상징색은 로열 블루와 실버, 상징꽃은 백합. 학교의 상징색과 꽃 엠블럼을 담은 제복을 착용한다.\"],[\"PRIME\",\"학생회이자 정예부대\",\"프라임은 학생회 역할을 수행하면서 학교를 대표하는 정예부대로 활동한다. 별도의 계열별 학생회장 직책은 두지 않는다.\"],[\"PERSONNEL\",\"아카데미의 인물 구성\",\"학장(제n대), 교수, 프라임, 전투집행부 학생과 전술통제부 학생으로 구성한다. 유학생 제도 등 추가 설정은 아직 확정하지 않았다.\"],[\"EDUCATION\",\"기초 교육 이후의 진학\",\"초·중·고 기관에서 기본 마법을 배우는 기초 교육을 받은 이후 아카데미에 입학할 수 있다. 아카데미에 입학하지 않고 일반인으로 살아갈 경우에는 공격 마법의 대부분이 제한되며, 생활 마법과 기초 마법을 활용해 살아간다.\"]]},\"nocturne\":{\"en\":\"Nocturne\",\"name\":\"녹턴 아카데미\",\"realm\":\"LOWER REALM / THE ETERNAL SUNSET\",\"location\":\"하계 · 세 세계의 가장 하층\",\"flower\":\"글라디올러스\",\"colors\":\"다크 레드 × 다크 그레이\",\"lead\":\"세계의 가장 아래, 닫힌 경계와 노을 아래의 아카데미.\\n마족과 수인, 다른 세계를 떠난 자들의 사정이 겹쳐진다.\",\"sections\":[[\"WORLD\",\"가장 하층에 놓인 세계\",\"녹턴이 자리한 하계는 세 세계의 가장 하층에 위치한다. 대표적인 종족으로 마족과 수인족 등이 있다. 푸른 하늘 대신 노을진 하늘이 펼쳐지며, 외부를 향해 자유롭게 열린 사회가 아니라 폐쇄적인 분위기를 지닌다.\"],[\"SOCIETY\",\"경계 너머에서 온 자들\",\"인간계나 천계에서 도망쳐 이곳에 이르는 이들도 있다. 이들의 사정과 출신은 제각각이며, 하계 전체나 특정 종족을 범죄자 집단으로 취급하지 않는다. 닫힌 사회의 내부 질서와 외부에서 유입된 삶들이 함께 존재한다.\"],[\"IDENTITY\",\"짙은 붉음, 글라디올러스\",\"상징색은 다크 레드와 다크 그레이, 상징꽃은 글라디올러스. 학교의 상징색과 꽃 엠블럼을 담은 제복을 착용한다.\"],[\"PRIME\",\"공적인 정예와 비밀의 경계\",\"녹턴의 프라임 역시 학생회 역할을 겸하는 정예부대다. 그러나 비밀 암살부대 이클립스 소속은 프라임이 될 수 없다. 두 조직의 소속과 역할은 구분된다.\"],[\"ECLIPSE\",\"알려지지 않은 필요악\",\"이클립스는 녹턴 내부에서도 존재를 쉽게 알 수 없는 비밀 암살부대다. 제니스특수청이 절대선의 공공기관으로 남아야 하기에, 이클립스는 그와 대조되는 필요악의 역할을 맡는다. 위험인물과 배신자를 제거하며 공개적인 전면전과 구분되는 은밀한 임무를 수행한다.\\n\\n이러한 역할의 대조가 두 조직의 공식 지휘·위탁 관계를 뜻하는 것은 아니다. 구체적인 조직 간 관계는 아직 정하지 않았다.\"],[\"COMMAND\",\"이클립스의 리더와 대원\",\"이클립스는 부대를 이끄는 리더와 그 아래 대원들로 구성된다. 부대원은 대부분 수인이며, 암살에 특화된 존재들이 많다. 모든 대원을 수인으로 한정하지는 않는다.\"],[\"PERSONNEL\",\"아카데미와 이클립스의 인명록\",\"학장·교수·프라임·전투집행부 학생·전술통제부 학생을 기록한다. 이클립스는 별도 분류로 리더와 대원을 기록하며, 프라임 분류와 겹치지 않는다.\"],[\"EDUCATION\",\"기초 교육 이후의 진학\",\"초·중·고 기관에서 기본 마법을 배우는 기초 교육을 받은 이후 아카데미에 입학할 수 있다. 아카데미에 입학하지 않고 일반인으로 살아갈 경우에는 공격 마법의 대부분이 제한되며, 생활 마법과 기초 마법을 활용해 살아간다.\"]]},\"zenith\":{\"en\":\"Zenith\",\"name\":\"제니스특수청\",\"realm\":\"PUBLIC INSTITUTION / THE HIGHEST STANDARD\",\"location\":\"위치 비공개 · 특수 게이트\",\"flower\":\"에델바이스\",\"colors\":\"퓨어 화이트 × 골드\",\"lead\":\"국가가 설립한 최정예 의회기관.\\n가장 위험한 현장에 투입되어 생명을 지키고, 착취당하는 약자를 보호한다.\",\"sections\":[[\"INSTITUTION\",\"국가가 만든 최정예 공공기관\",\"제니스특수청은 아카데미가 아니라 국가가 설립한 최정예 의회기관이다. 공공기관으로서 절대선의 존재로 남아야 하며, 세 세계의 위험한 현장과 위협에 대응한다.\"],[\"RECRUITMENT\",\"접촉과 선발 시험\",\"각 아카데미의 졸업생들이 모이는 교육기관이 아니다. 뛰어난 역량을 보이는 최정예 아카데미생에게 직접 접촉해 영입하거나, 인원을 모집하는 선발 시험을 치른다. 구체적인 시험 주기와 지원 요건은 미정이다.\"],[\"OUTER RESPONSE\",\"가장 위험한 아우터의 토벌\",\"가장 위험한 아우터를 상대하는 토벌 임무를 수행한다. 최정예 전력과 전문 인력을 위험한 현장에 투입한다.\"],[\"PUBLIC SERVICE\",\"현장 대응과 약자 보호\",\"위험한 현장에서 공공의 안전을 지키는 역할과, 착취당하는 약자를 보호하는 역할을 담당하는 부서가 있다. 부서별 세부 명칭과 조직도는 아직 확정하지 않았다.\"],[\"ORGANIZATION\",\"프라임 대신 부서 체계\",\"제니스특수청에는 프라임이 없다. 인원은 부서에 소속되며, 인명록에서 부서명과 세부 직책을 자유롭게 기록할 수 있다. 기존 아카데미식 학장·교수·학생회 조직은 적용하지 않는다.\"],[\"IDENTITY\",\"순백과 금빛 에델바이스\",\"상징색은 퓨어 화이트와 골드, 상징꽃은 에델바이스. 제복을 착용한다.\"],[\"CONTRAST\",\"빛 아래의 제니스, 그림자의 이클립스\",\"제니스특수청은 절대선의 존재로서 공적인 보호와 대응을 수행한다. 이클립스는 위험인물과 배신자를 은밀하게 제거하는 필요악이다. 역할은 대조되지만, 서로의 공식 소속·지휘·의뢰 관계는 별도로 정해지지 않았다.\"],[\"INVESTIGATION\",\"숨은 불법 조직의 조사와 제압\",\"제니스특수청에는 신디케이트 등 불법 조직을 조사하고 제압·해체하려는 담당 부서가 있다. 인신매매·불법 경매·수인 및 희귀 종족 투기장·생체 실험 등이 조사 대상이다. 부서명은 아직 확정하지 않았다.\"]]}};\nconst $=s=>document.querySelector(s),id='zenith';let all={};try{all=JSON.parse(localStorage.getItem('trinity-academies-v1')||'{}')}catch{}let record=structuredClone(all[id]||defaults[id]),editing=false,before;for(const item of defaults[id].sections.filter(v=>['EDUCATION','INVESTIGATION'].includes(v[0])))if(!record.sections.some(v=>v[0]===item[0]))record.sections.push(structuredClone(item));document.title=record.name+' · Trinity Nexus';const names={union:'유니온',arcadia:'아르카디아',nocturne:'녹턴',zenith:'제니스특수청'};for(const [k,v] of Object.entries(names)){const a=document.createElement('a');a.href=k==='zenith'?'agency.html':'academy.html?school='+k;a.textContent=v;a.classList.toggle('active',k===id);$('#schoolnav').append(a)}for(const el of [$('#rosterTop'),$('#rosterBottom')])el.href='personnel.html?school='+id;\nfunction render(){for(const e of document.querySelectorAll('[data-field]'))e.textContent=record[e.dataset.field]||'';$('#articles').replaceChildren();record.sections.forEach((s,i)=>{const a=document.createElement('article');a.className='article'+(s[2].length>200?' full':'');for(const [tag,cls,index] of [['div','sectionlabel',0],['h3','',1],[' dow.navigateSingle(h)}},true);\n\u003c/script>\u003cscript>document.addEventListener('click',e=>{if(window.TRINITY_CAN_EDIT)return;const selector='#editmode,#saveworld,#cancelworld,#designworld,#backupall,#restoreall,#edit,#save,#cancel,#add,#backup,#restore,#design,#themeBtn,#completeBackup,#download,.section-head>button,.placeholder,.sectiontools,.edit-person,.remove,.dossier-layout button.primary';if(e.target.closest(selector)){e.preventDefault();e.stopImmediatePropagation();parent.postMessage({type:'trinity-code-required'},'*')}},true);\u003c/script>\u003c/head>\u003cbody data-owner=\"__TRINITY_OWNER__\">\n\u003cheader class=\"top\">\u003cdiv class=\"brand\">TRINITY NEXUS\u003csmall>THREE ACADEMIES & ZENITH · PERSONNEL ARCHIVE\u003c/small>\u003c/div>\u003cdiv class=\"tools\">\u003ca href=\"./\" class=\"back-world\">세계관 기록관\u003c/a>\u003cbutton id=\"schoolPageBtn\">소속 설명\u003c/button>\u003cbutton id=\"themeBtn\">색상·무늬\u003c/button>\u003cbutton id=\"completeBackup\">전체 백업\u003c/button>\u003cbutton id=\"guideBtn\">세계관 가이드\u003c/button>\u003cbutton id=\"helpBtn\">사용 안내\u003c/button>\u003cbutton id=\"backup\">백업 저장\u003c/button>\u003cbutton id=\"restore\">백업 불러오기\u003c/button>\u003cbutton id=\"download\">HTML로 저장\u003c/button>\u003c/div>\u003c/header>\n\u003cdiv class=\"layout\">\u003caside>\u003cdiv class=\"eyebrow\">SELECT AN ACADEMY\u003c/div>\u003cnav id=\"nav\">\u003c/nav>\u003cdiv class=\"aside-note\">세 세계가 교차하는 곳,\u003cbr>각자의 운명이 기록된다.\u003cbr>\u003cbr>\u003cspan id=\"saveStatus\">이 브라우저에 자동 저장\u003c/span>\u003c/div>\u003c/aside>\u003cmain>\u003cdiv class=\"hero\">\u003cdiv class=\"geometry-art geo\" data-geometry=\"active\">\u003c/div>\u003cdiv class=\"seal\" id=\"seal\">\u003c/div>\u003cdiv class=\"eyebrow\" id=\"realm\">\u003c/div>\u003ch1 id=\"schoolName\">\u003c/h1>\u003ch2 id=\"schoolKo\">\u003c/h2>\u003cp id=\"schoolDesc\">\u003c/p>\u003cdiv class=\"meta\" id=\"meta\">\u003c/div>\u003c/div>\u003cdiv class=\"toolbar\">\u003cinput id=\"search\" class=\"search\" placeholder=\"이름 · 속성 · 팀 · 부서 검색\" aria-label=\"캐릭터 검색\">\u003cspan class=\"eyebrow\" id=\"count\">\u003c/span>\u003cbutton id=\"add\" class=\"primary\">+ 캐릭터 등록\u003c/button>\u003c/div>\u003cdiv id=\"sections\">\u003c/div>\u003cdiv class=\"footer\">TRINITY NEXUS / ACADEMIES & PUBLIC INSTITUTION RECORDS\u003c/div>\u003c/main>\u003c/div>\n\n\u003cdialog id=\"worldGuide\" aria-labelledby=\"guideTitle\">\u003cdiv class=\"modal-head guide-top\">\u003cdiv>\u003cdiv class=\"guide-label\">TRINITY NEXUS / WORLD GUIDE\u003c/div>\u003ch2 id=\"guideTitle\">세계관 가이드\u003c/h2>\u003c/div>\u003cbutton id=\"guideClose\">닫기 ×\u003c/button>\u003c/div>\u003cdiv class=\"guide-layout\">\u003cdiv class=\"guide-index\">확정 세계관 가이드\u003cbr>3개 아카데미와 공공기관\u003c/div>\u003carticle class=\"guide-content\">\u003cdiv class=\"guide-lead\">\u003cstrong>세 아카데미와 제니스특수청\u003c/strong>\u003cp>프라임은 각 아카데미의 학생회 역할을 겸하는 정예부대다. 제니스특수청은 프라임이 없는 공공기관이며 부서 체계로 운영된다.\u003c/p>\u003c/div>\u003csection>\u003ch3>센트럴 유니온 아카데미\u003c/h3>\u003ch4>가장 넓은 세계, 교류의 중심\u003c/h4>\u003cp>센트럴 유니온은 세계를 잇는 중심이며, 세 세계 가운데 가장 큰 규모를 지닌다. 대표적인 종족은 인간·요정족·드워프다. 다양한 종족이 함께 살아가며, 용족은 드물게 존재하지만 특정 세계 한곳에만 속하지 않는다.\u003c/p>\u003ch4>모든 길이 모이는 아카데미\u003c/h4>\u003cp>센트럴 유니온 아카데미는 다른 세계의 아카데미에 비해 압도적인 규모를 자랑한다. 지리적 이점과 시설 규모, 많은 인원 덕분에 대부분의 대규모 행사와 교류가 이곳에서 열린다.\u003c/p>\u003ch4>질서와 조화의 코스모스\u003c/h4>\u003cp>상징색은 검은색과 흰색, 상징꽃은 코스모스. 코스모스는 질서·조화·우주를 뜻하며 혼돈과 대립한다. 학교의 상징색과 꽃 엠블럼을 담은 제복을 착용한다.\u003c/p>\u003ch4>학생회이자 정예부대\u003c/h4>\u003cp>프라임은 아카데미의 학생회 역할을 수행하는 동시에, 학교를 대표하는 정예부대다. 별도의 엑스큐터 학생회장이나 아키텍트 학생회장은 두지 않는다.\u003c/p>\u003ch4>아카데미의 인물 구성\u003c/h4>\u003cp>학장(제n대), 교수, 프라임, 전투집행부 학생과 전술통제부 학생으로 구성한다. 프라임 내부의 세부 직책과 팀·페어는 인물별로 기록할 수 있다.\u003c/p>\u003c/section>\u003csection>\u003ch3>아르카디아 아카데미\u003c/h3>\u003ch4>규율과 권위를 중시하는 전당\u003c/h4>\u003cp>아르카디아는 천계의 아카데미로, 규율과 질서를 중시한다. 하계와의 단순한 라이벌 관계보다는 오래 축적된 권위적인 문화와 위계가 사회 분위기에 큰 영향을 미친다.\u003c/p>\u003ch4>오래된 선민의식의 잔재\u003c/h4>\u003cp>과거 천족의 혈통과 신성성이 다른 종족보다 우월한 지위를 부여한다는 관념이 사회의 위계와 권위를 정당화했다. 그 질서가 오래 유지된 탓에, 오늘날에도 일부 가문·교수·관료 사이에는 출신 종족을 능력과 품격의 기준으로 삼는 태도가 남아 있다.\u003cbr>\u003cbr>이는 모든 천족이 같은 편견을 지녔다는 뜻이 아니다. 전통을 지키려는 이들과 낡은 차별을 바꾸려는 이들이 공존하며, 그 차이가 아카데미 안의 갈등으로 이어질 수 있다.\u003c/p>\u003ch4>푸른 질서, 은빛 백합\u003c/h4>\u003cp>상징색은 로열 블루와 실버, 상징꽃은 백합. 학교의 상징색과 꽃 엠블럼을 담은 제복을 착용한다.\u003c/p>\u003ch4>학생회이자 정예부대\u003c/h4>\u003cp>프라임은 학생회 역할을 수행하면서 학교를 대표하는 정예부대로 활동한다. 별도의 계열별 학생회장 직책은 두지 않는다.\u003c/p>\u003ch4>아카데미의 인물 구성\u003c/h4>\u003cp>학장(제n대), 교수, 프라임, 전투집행부 학생과 전술통제부 학생으로 구성한다. 유학생 제도 등 추가 설정은 아직 확정하지 않았다.\u003c/p>\u003c/section>\u003csection>\u003ch3>녹턴 아카데미\u003c/h3>\u003ch4>가장 하층에 놓인 세계\u003c/h4>\u003cp>녹턴이 자리한 하계는 세 세계의 가장 하층에 위치한다. 대표적인 종족으로 마족과 수인족 등이 있다. 푸른 하늘 대신 노을진 하늘이 펼쳐지며, 외부를 향해 자유롭게 열린 사회가 아니라 폐쇄적인 분위기를 지닌다.\u003c/p>\u003ch4>경계 너머에서 온 자들\u003c/h4>\u003cp>인간계나 천계에서 도망쳐 이곳에 이르는 이들도 있다. 이들의 사정과 출신은 제각각이며, 하계 전체나 특정 종족을 범죄자 집단으로 취급하지 않는다. 닫힌 사회의 내부 질서와 외부에서 유입된 삶들이 함께 존재한다.\u003c/p>\u003ch4>짙은 붉음, 글라디올러스\u003c/h4>\u003cp>상징색은 다크 레드와 다크 그레이, 상징꽃은 글라디올러스. 학교의 상징색과 꽃 엠블럼을 담은 제복을 착용한다.\u003c/p>\u003ch4>공적인 정예와 비밀의 경계\u003c/h4>\u003cp>녹턴의 프라임 역시 학생회 역할을 겸하는 정예부대다. 그러나 비밀 암살부대 이클립스 소속은 프라임이 될 수 없다. 두 조직의 소속과 역할은 구분된다.\u003c/p>\u003ch4>알려지지 않은 필요악\u003c/h4>\u003cp>이클립스는 녹턴 내부에서도 존재를 쉽게 알 수 없는 비밀 암살부대다. 제니스특수청이 절대선의 공공기관으로 남아야 하기에, 이클립스는 그와 대조되는 필요악의 역할을 맡는다. 위험인물과 배신자를 제거하며 공개적인 전면전과 구분되는 은밀한 임무를 수행한다.\u003cbr>\u003cbr>이러한 역할의 대조가 두 조직의 공식 지휘·위탁 관계를 뜻하는 것은 아니다. 구체적인 조직 간 관계는 아직 정하지 않았다.\u003c/p>\u003ch4>이클립스의 리더와 대원\u003c/h4>\u003cp>이클립스는 부대를 이끄는 리더와 그 아래 대원들로 구성된다. 부대원은 대부분 수인이며, 암살에 특화된 존재들이 많다. 모든 대원을 수인으로 한정하지는 않는다.\u003c/p>\u003ch4>아카데미와 이클립스의 인명록\u003c/h4>\u003cp>학장·교수·프라임·전투집행부 학생·전술통제부 학생을 기록한다. 이클립스는 별도 분류로 리더와 대원을 기록하며, 프라임 분류와 겹치지 않는다.\u003c/p>\u003c/section>\u003csection>\u003ch3>제니스특수청\u003c/h3>\u003ch4>국가가 만든 최정예 공공기관\u003c/h4>\u003cp>제니스특수청은 아카데미가 아니라 국가가 설립한 최정예 의회기관이다. 공공기관으로서 절대선의 존재로 남아야 하며, 세 세계의 위험한 현장과 위협에 대응한다.\u003c/p>\u003ch4>접촉과 선발 시험\u003c/h4>\u003cp>각 아카데미의 졸업생들이 모이는 교육기관이 아니다. 뛰어난 역량을 보이는 최정예 아카데미생에게 직접 접촉해 영입하거나, 인원을 모집하는 선발 시험을 치른다. 구체적인 시험 주기와 지원 요건은 미정이다.\u003c/p>\u003ch4>가장 위험한 아우터의 토벌\u003c/h4>\u003cp>가장 위험한 아우터를 상대하는 토벌 임무를 수행한다. 최정예 전력과 전문 인력을 위험한 현장에 투입한다.\u003c/p>\u003ch4>현장 대응과 약자 보호\u003c/h4>\u003cp>위험한 현장에서 공공의 안전을 지키는 역할과, 착취당하는 약자를 보호하는 역할을 담당하는 부서가 있다. 부서별 세부 명칭과 조직도는 아직 확정하지 않았다.\u003c/p>\u003ch4>프라임 대신 부서 체계\u003c/h4>\u003cp>제니스특수청에는 프라임이 없다. 인원은 부서에 소속되며, 인명록에서 부서명과 세부 직책을 자유롭게 기록할 수 있다. 기존 아카데미식 학장·교수·학생회 조직은 적용하지 않는다.\u003c/p>\u003ch4>순백과 금빛 에델바이스\u003c/h4>\u003cp>상징색은 퓨어 화이트와 골드, 상징꽃은 에델바이스. 제복을 착용한다.\u003c/p>\u003ch4>빛 아래의 제니스, 그림자의 이클립스\u003c/h4>\u003cp>제니스특수청은 절대선의 존재로서 공적인 보호와 대응을 수행한다. 이클립스는 위험인물과 배신자를 은밀하게 제거하는 필요악이다. 역할은 대조되지만, 서로의 공식 소속·지휘·의뢰 관계는 별도로 정해지지 않았다.\u003c/p>\u003c/section>\u003csection>\u003ch3>마법과 발현\u003c/h3>\u003cp>모든 존재는 마력을 가지고 태어나며 고유 속성이 발현된다. 아직 고유 속성이 발현되지 않은 자는 블랭크다. 초·중·고 기관을 통해 기본 마법을 배울 수 있으나, 블랭크는 고유 속성 마법과 고위 마법을 사용하기 어렵다.\u003c/p>\u003ch4>기초 교육과 아카데미\u003c/h4>\u003cp>기초 교육을 받은 이후 아카데미에 입학할 수 있다. 입학하지 않고 일반인으로 살아갈 경우 공격 마법 대부분이 제한되며, 생활 마법과 기초 마법을 활용한다.\u003c/p>\u003ch4>마력 과부하와 튜닝\u003c/h4>\u003cp>자신이 가진 마력량보다 많이 사용하거나 제대로 연마하지 않은 마법을 사용하면 과부하가 발생한다. 물약을 사용할 수 있으나 과도한 사용은 중독 현상을 일으킨다. 마법 회로가 손상되면 튜너에게 튜닝을 받아야 한다.\u003c/p>\u003ch4>속성의 분류\u003c/h4>\u003cp>원소·자연·명암·특수·시공간 등이 있다.\u003c/p>\u003ch4>아키텍트 분야\u003c/h4>\u003cp>튜너·알케미스트·가디언·힐러·버퍼 등이 있다. 속성과 전문 분야는 구분해 기록한다.\u003c/p>\u003c/section>\u003csection>\u003ch3>세계의 이면 · 숨은 조직\u003c/h3>\u003cp>가장 큰 불법 조직인 신디케이트를 비롯해 정체와 활동을 숨긴 조직들이 존재한다. 아카데미 시스템에 환멸을 느끼거나 제약에 불만을 품은 이들이 가담하기도 한다.\u003c/p>\u003cp>센트럴 유니온의 사각지대에서는 인신매매와 불법 경매가 이루어지기도 한다. 수인과 희귀 종족을 이용한 투기장, 아우터 인자와 마력 회로를 이용한 불법 생체 실험도 존재한다.\u003c/p>\u003ch4>제니스특수청의 대응\u003c/h4>\u003cp>이들을 조사하고 제압·해체하려는 담당 부서가 있다. 부서명은 아직 미정이다.\u003c/p>\u003c/section>\u003csection>\u003ch3>아우터와 주요 행사\u003c/h3>\u003cp>아우터는 침식급·변이급·환란급·재앙급·파멸급·종말급의 여섯 단계로 나뉜다. 랭킹전은 1월 1일과 7월 1일 개막, 연합 실습은 4월 초, 별빛축제는 10월 10일 개최한다.\u003c/p>\u003c/section>\u003c/article>\u003c/div>\u003c/dialog>\n\u003cdialog id=\"editor\">\u003cform id=\"form\">\u003cdiv class=\"modal-head\">\u003ch2>캐릭터 기록\u003c/h2>\u003cbutton type=\"button\" id=\"close\">닫기 ×\u003c/button>\u003c/div>\u003cdiv class=\"photo-edit\">\u003cimg id=\"photoPreview\" alt=\"등록 사진 미리보기\">\u003cdiv>\u003clabel>캐릭터 사진\u003cinput id=\"photo\" type=\"file\" accept=\"image/*\">\u003c/label>\u003cp>사진은 자동으로 크기를 줄여 보관합니다.\u003cbr>사진과 입력 내용은 HTML 저장에도 포함됩니다.\u003c/p>\u003cbutton type=\"button\" id=\"removePhoto\">사진 지우기\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"form-grid\">\u003clabel>이름 *\u003cinput name=\"name\" required maxlength=\"100\" placeholder=\"캐릭터 이름\">\u003c/label>\u003clabel>아카데미 / 공공기관\u003cselect id=\"recordSchool\">\u003c/select>\u003c/label>\u003clabel>직책 / 소속\u003cselect name=\"role\">\u003c/select>\u003c/label>\u003clabel id=\"generationWrap\">학장 대수\u003cinput name=\"generation\" type=\"number\" min=\"1\" max=\"9999\" placeholder=\"예: 7 → 제7대 학장\">\u003c/label>\u003clabel>계열\u003cselect name=\"track\">\u003coption value=\"\">미정 / 해당 없음\u003c/option>\u003coption>엑스큐터 · CED\u003c/option>\u003coption>아키텍트 · TCD\u003c/option>\u003coption>블랭크\u003c/option>\u003c/select>\u003c/label>\u003clabel>종족 · 나이\u003cinput name=\"species\" placeholder=\"천족 / 28세\">\u003c/label>\u003clabel>고유 속성 · 전문 분야\u003cinput name=\"ability\" placeholder=\"빙결 / 튜너 / 봉인술\">\u003c/label>\u003clabel id=\"departmentWrap\">제니스특수청 부서\u003cinput name=\"department\" placeholder=\"부서명을 직접 입력하세요\">\u003c/label>\u003clabel>팀 · 페어\u003cinput name=\"team\" placeholder=\"팀명 / 파트너 / 제니스특수청 부서명\">\u003c/label>\u003clabel>세부 직책\u003cinput name=\"position\" placeholder=\"프라임 대장 / 교수 담당 과목 등\">\u003c/label>\u003clabel class=\"wide\">한 줄 소개\u003cinput name=\"intro\" maxlength=\"250\" placeholder=\"캐릭터를 나타내는 문장\">\u003c/label>\u003clabel class=\"wide\">성격 · 설정 · 관계\u003ctextarea name=\"notes\" placeholder=\"외모, 성격, 과거, 다른 캐릭터와의 관계 등을 자유롭게 기록\">\u003c/textarea>\u003c/label>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton type=\"button\" id=\"delete\" class=\"danger\">캐릭터 삭제\u003c/button>\u003cbutton type=\"submit\" class=\"primary\">기록 저장\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>\n\u003cdialog id=\"help\">\u003cdiv class=\"modal-head\">\u003ch2>인명록 사용 안내\u003c/h2>\u003cbutton id=\"helpClose\">닫기 ×\u003c/button>\u003c/div>\u003cdiv class=\"help\">\u003cp>\u003cb>1.\u003c/b> 소속을 선택하고, 직책 아래의 추가 버튼으로 캐릭터를 등록하세요. 등록된 카드를 누르면 상세 정보를 볼 수 있습니다. 편집은 코드 인증 후 가능합니다.\u003c/p>\u003cp>\u003cb>2.\u003c/b> 세 아카데미는 학장·교수·프라임·부서 학생을 기록합니다. 프라임은 학생회 역할을 겸하는 정예부대입니다. 녹턴에는 이클립스 리더·대원을 별도로 기록하며 프라임과 중복 소속되지 않습니다. 제니스특수청은 부서 소속 인원을 기록합니다.\u003c/p>\u003cp>\u003cb>3.\u003c/b> 수정 내용은 현재 브라우저에 자동 저장됩니다. 브라우저 데이터 삭제나 다른 기기로 이동할 때를 대비해 \u003cb>백업 저장\u003c/b>을 이용하세요.\u003c/p>\u003cp>\u003cb>4.\u003c/b> \u003cb>HTML로 저장\u003c/b>은 사진과 현재 기록을 모두 포함한 새 HTML 파일을 만듭니다. 내려받은 파일을 브라우저에서 열면 그대로 이어서 사용할 수 있습니다.\u003c/p>\u003cp>사진 업로드와 캐릭터 기록은 외부 서버로 전송되지 않습니다. 브라우저 저장 공간이 부족해지면 백업 또는 HTML 저장을 해주세요.\u003c/p>\u003c/div>\u003c/dialog>\u003cinput type=\"file\" id=\"importFile\" accept=\".json,application/json\" hidden>\u003cdiv id=\"toast\" class=\"notice hidden\" role=\"status\">\u003c/div>\n\u003cscript id=\"seed\" type=\"application/json\">{\"version\":1,\"characters\":[],\"school\":\"zenith\"}\u003c/script>\n\u003cscript>\n'use strict';\nconst schools={zenith:{en:'Zenith',ko:'제니스특수청',realm:'CLASSIFIED LOCATION / SPECIAL GATE ACCESS',flower:'에델바이스',symbol:'✧',colors:['#d6bd80','#111311','#1c201c','#f3f1e8','#a7aca3','#d6bd801a'],desc:'국가가 설립한 최정예 의회기관. 가장 위험한 현장에 투입되어 생명을 지키고, 착취당하는 약자를 보호한다.',mood:'퓨어 화이트 × 골드 · 통제와 비밀'},union:{en:'Central Union',ko:'센트럴 유니온 아카데미',realm:'HUMAN REALM / THE CROSSROADS OF THREE WORLDS',flower:'코스모스',symbol:'✳',colors:['#cbd5df','#10151b','#1a222b','#f2f5f7','#a6b1bd','#cbd5df15'],desc:'세 세계의 중심에서 모든 종족이 만나는 곳. 자유와 활기, 경쟁과 가능성이 공존하는 가장 거대한 아카데미.',mood:'블랙 × 화이트 · 질서와 조화'},arcadia:{en:'Arcadia',ko:'아르카디아 아카데미',realm:'CELESTIAL REALM / THE HALLS OF HONOR',flower:'백합',symbol:'⚜',colors:['#9cb7ea','#0b1429','#121f3b','#edf1fc','#a2afca','#769ce921'],desc:'규율과 전통, 권위가 st snapshot={};for(const k of keys)snapshot[k]=localStorage.getItem(k);localStorage.setItem('trinity-canon-previous-v1',JSON.stringify(snapshot));const old={\"union\": {\"en\": \"Central Union\", \"name\": \"센트럴 유니온 아카데미\", \"realm\": \"HUMAN REALM / THE CROSSROADS\", \"location\": \"인간계 · 세 세계의 중심\", \"flower\": \"코스모스\", \"colors\": \"블랙 × 화이트\", \"lead\": \"세 세계의 중심에서 모든 종족이 만나는 곳.\\n자유와 활기, 경쟁과 가능성이 공존하는 가장 거대한 아카데미.\", \"sections\": [[\"ACADEMY\", \"세 세계를 잇는 중심\", \"천족·마족·인간 등 모든 종족이 모이는 교류의 장. 네 아카데미 가운데 가장 거대한 규모와 가장 많은 인원수를 자랑한다. 고도로 발달한 미래도시를 배경으로 자유롭고 활발한 분위기가 흐른다.\"], [\"IDENTITY\", \"질서와 조화의 코스모스\", \"상징색은 검은색과 흰색, 상징꽃은 코스모스. 코스모스는 질서·조화·우주를 뜻하며 혼돈과 대립한다. 상징색과 꽃 엠블럼을 담은 교복형 제복을 착용한다.\"], [\"EXCHANGE\", \"경쟁과 축제가 만나는 곳\", \"지리적 이점과 압도적인 시설 규모 덕분에 학교 대항 랭킹전과 별빛축제 등 주요 연합 행사가 이곳에서 열린다. 랭킹전은 매년 1월 1일과 7월 1일 개막하며, 별빛축제는 10월 10일 개최한다.\"], [\"PERSONNEL\", \"아카데미의 인물 구성\", \"학장(제n대), 교수, 프라임, 엑스큐터 학생회장, 아키텍트 학생회장, 전투집행부 학생과 전술통제부 학생으로 인명록을 구성한다. 프라임은 랭킹 상위권 부서다.\"]]}, \"arcadia\": {\"en\": \"Arcadia\", \"name\": \"아르카디아 아카데미\", \"realm\": \"CELESTIAL REALM / HONOR & ORDER\", \"location\": \"천계\", \"flower\": \"백합\", \"colors\": \"로열 블루 × 실버\", \"lead\": \"고결한 이상과 엄정한 규율을 잇는 전당.\\n천계의 명예 아래, 선택받은 자들의 역사가 쌓인다.\", \"sections\": [[\"ACADEMY\", \"고결함과 규율의 전당\", \"천계 특유의 고결하고 엘리트적인 분위기를 지닌 아카데미. 규율 엄수를 중시하는 고귀하고 정제된 배움의 장이다.\"], [\"IDENTITY\", \"푸른 질서, 은빛 백합\", \"상징색은 로열 블루와 실버, 상징꽃은 백합. 학교의 상징색과 백합 엠블럼을 담은 세련된 교복형 제복을 착용한다.\"], [\"EXCHANGE\", \"경쟁 속에서 이어지는 교류\", \"하계와의 라이벌 의식이 존재하지만, 공동의 적 아우터를 상대로 협력한다. 센트럴 유니온의 랭킹전과 별빛축제, 순환 개최되는 연합 실습을 통해 타교와 교류한다.\"], [\"PERSONNEL\", \"아카데미의 인물 구성\", \"학장(제n대), 교수, 프라임, 엑스큐터 학생회장, 아키텍트 학생회장, 전투집행부 학생과 전술통제부 학생으로 인명록을 구성한다.\"]]}, \"nocturne\": {\"en\": \"Nocturne\", \"name\": \"녹턴 아카데미\", \"realm\": \"LOWER REALM / THE ETERNAL SUNSET\", \"location\": \"하계\", \"flower\": \"글라디올러스\", \"colors\": \"다크 레드 × 다크 그레이\", \"lead\": \"푸른 하늘 대신 노을이 머무는 하계.\\n우아한 자유와 은밀한 계약, 짙은 밤의 야망이 교차한다.\", \"sections\": [[\"ACADEMY\", \"노을 아래의 아카데미\", \"마족 특유의 우아함과 짙은 밤의 매력을 지닌 아카데미. 푸른 하늘을 볼 수 없는 노을진 하늘 아래, 퇴폐적이고 자유로운 분위기가 형성되어 있다.\"], [\"IDENTITY\", \"짙은 붉음, 글라디올러스\", \"상징색은 다크 레드와 다크 그레이, 상징꽃은 글라디올러스. 각 색과 꽃 엠블럼이 들어간 교복형 제복을 착용한다.\"], [\"ECLIPSE\", \"비밀 암살부대 · 이클립스\", \"녹턴 내부의 비밀 암살부대. 배신자와 뒷세계 간부 등 지정된 표적을 은밀하게 제거한다. 공개적인 랭킹전이나 전면전과 구분되는 임무를 수행한다.\\n\\n이클립스의 대원은 수인들로 구성한다. 세부 종과 인물 구성은 인명록에 자유롭게 기록할 수 있다.\"], [\"PERSONNEL\", \"아카데미의 인물 구성\", \"학장(제n대), 교수, 프라임, 엑스큐터 학생회장, 아키텍트 학생회장, 전투집행부 학생과 전술통제부 학생으로 인명록을 구성한다.\"]]}, \"zenith\": {\"en\": \"Zenith\", \"name\": \"제니스 특수청 아카데미\", \"realm\": \"CLASSIFIED / BEYOND THE SPECIAL GATE\", \"location\": \"위치 비공개 · 특수 게이트\", \"flower\": \"에델바이스\", \"colors\": \"퓨어 화이트 × 골드\", \"lead\": \"정점에 선 이들을 위한 마지막 관문.\\n특수 게이트 너머, 재앙급 아우터에 맞서는 최정예들의 기록.\", \"sections\": [[\"ACADEMY\", \"정점에 모인 최정예\", \"각 아카데미의 최우수 졸업생이 모여 재앙급 아우터 토벌을 전담하는 최정예 기관. 이름은 정점을 뜻하며, 통제되고 비밀스러우며 서늘한 분위기를 지닌다.\"], [\"ACCESS\", \"특수 게이트 너머\", \"제니스의 위치는 철저한 비밀이다. 오직 특수 게이트를 통해서만 접근할 수 있다.\"], [\"IDENTITY\", \"순백과 금빛 에델바이스\", \"상징색은 퓨어 화이트와 골드, 상징꽃은 에델바이스. 최정예 기관의 정체성을 상징색과 꽃 엠블럼으로 표현한다.\"], [\"PERSONNEL\", \"X와 프라임\", \"제니스 인명록에는 X와 프라임만 등록한다. 일반 아카데미의 학장 대수, 교수, 학생회장, 일반 부서 학생 분류는 두지 않는다. X의 세부 정체와 권한은 아직 정해지지 않았다.\"], [\"ADMISSION\", \"선발과 입학 자격\", \"각 아카데미의 최우수 졸업생을 선발한다. 랭킹전 우승 팀원에게도 입학 자격이 주어지며, 비우승자도 역량을 인정받아 추천서로 입학 신청이 가능하다. 졸업생 선발 원칙과 랭킹전 입학 자격의 구체적인 적용 시점은 추후 확정할 설정이다.\"]]}},newData={\"union\": {\"en\": \"Central Union\", \"name\": \"센트럴 유니온 아카데미\", \"realm\": \"HUMAN REALM / THE CROSSROADS\", \"location\": \"인간계 · 세 세계의 중심\", \"flower\": \"코스모스\", \"colors\": \"블랙 × 화이트\", \"lead\": \"인간·요정·드워프가 함께 살아가는 가장 큰 세계.\\n세계를 잇는 중심이자, 압도적인 규모로 교류와 행사를 이끄는 아카데미.\", \"sections\": [[\"WORLD\", \"가장 넓은 세계, 교류의 중심\", \"센트럴 유니온은 세계를 잇는 중심이며, 세 세계 가운데 가장 큰 규모를 지닌다. 대표적인 종족은 인간·요정족·드워프다. 다양한 종족이 함께 살아가며, 용족은 드물게 존재하지만 특정 세계 한곳에만 속하지 않는다.\"], [\"ACADEMY\", \"모든 길이 모이는 아카데미\", \"센트럴 유니온 아카데미는 다른 세계의 아카데미에 비해 압도적인 규모를 자랑한다. 지리적 이점과 시설 규모, 많은 인원 덕분에 대부분의 대규모 행사와 교류가 이곳에서 열린다.\"], [\"IDENTITY\", \"질서와 조화의 코스모스\", \"상징색은 검은색과 흰색, 상징꽃은 코스모스. 코스모스는 질서·조화·우주를 뜻하며 혼돈과 대립한다. 학교의 상징색과 꽃 엠블럼을 담은 제복을 착용한다.\"], [\"PRIME\", \"학생회이자 정예부대\", \"프라임은 아카데미의 학생회 역할을 수행하는 동시에, 학교를 대표하는 정예부대다. 별도의 엑스큐터 학생회장이나 아키텍트 학생회장은 두지 않는다.\"], [\"PERSONNEL\", \"아카데미의 인물 구성\", \"학장(제n대), 교수, 프라임, 전투집행부 학생과 전술통제부 학생으로 구성한다. 프라임 내부의 세부 직책과 팀·페어는 인물별로 기록할 수 있다.\"]]}, \"arcadia\": {\"en\": \"Arcadia\", \"name\": \"아르카디아 아카데미\", \"realm\": \"CELESTIAL REALM / HONOR & ORDER\", \"location\": \"천계\", \"flower\": \"백합\", \"colors\": \"로열 블루 × 실버\", \"lead\": \"규율과 전통, 권위가 깊이 뿌리내린 천계의 아카데미.\\n오래된 혈통의 질서와 변화를 향한 의지가 교차한다.\", \"sections\": [[\"ACADEMY\", \"규율과 권위를 중시하는 전당\", \"아르카디아는 천계의 아카데미로, 규율과 질서를 중시한다. 하계와의 단순한 라이벌 관계보다는 오래 축적된 권위적인 문화와 위계가 사회 분위기에 큰 영향을 미친다.\"], [\"HERITAGE\", \"오래된 선민의식의 잔재\", \"과거 천족의 혈통과 신성성이 다른 종족보다 우월한 지위를 부여한다는 관념이 사회의 위계와 권위를 정당화했다. 그 질서가 오래 유지된 탓에, 오늘날에도 일부 가문·교수·관료 사이에는 출신 종족을 능력과 품격의 기준으로 삼는 태도가 남아 있다.\\n\\n이는 모든 천족이 같은 편견을 지녔다는 뜻이 아니다. 전통을 지키려는 이들과 낡은 차별을 바꾸려는 이들이 공존하며, 그 차이가 아카데미 안의 갈등으로 이어질 수 있다.\"], [\"IDENTITY\", \"푸른 질서, 은빛 백합\", \"상징색은 로열 블루와 실버, 상징꽃은 백합. 학교의 상징색과 꽃 엠블럼을 담은 제복을 착용한다.\"], [\"PRIME\", \"학생회이자 정예부대\", \"프라임은 학생회 역할을 수행하면서 학교를 대표하는 정예부대로 활동한다. 별도의 계열별 학생회장 직책은 두지 않는다.\"], [\"PERSONNEL\", \"아카데미의 인물 구성\", \"학장(제n대), 교수, 프라임, 전투집행부 학생과 전술통제부 학생으로 구성한다. 유학생 제도 등 추가 설정은 아직 확정하지 않았다.\"]]}, \"nocturne\": {\"en\": \"Nocturne\", \"name\": \"녹턴 아카데미\", \"realm\": \"LOWER REALM / THE ETERNAL SUNSET\", \"location\": \"하계 · 세 세계의 가장 하층\", \"flower\": \"글라디올러스\", \"colors\": \"다크 레드 × 다크 그레이\", \"lead\": \"세계의 가장 아래, 닫힌 경계와 노을 아래의 아카데미.\\n마족과 수인, 다른 세계를 떠난 자들의 사정이 겹쳐진다.\", \"sections\": [[\"WORLD\", \"가장 하층에 놓인 세계\", \"녹턴이 자리한 하계는 세 세계의 가장 하층에 위치한다. 대표적인 종족으로 마족과 수인족 등이 있다. 푸른 하늘 대신 노을진 하늘이 펼쳐지며, 외부를 향해 자유롭게 열린 사회가 아니라 폐쇄적인 분위기를 지닌다.\"], [\"SOCIETY\", \"경계 너머에서 온 자들\", \"인간계나 천계에서 도망쳐 이곳에 이르는 이들도 있다. 이들의 사정과 출신은 제각각이며, 하계 전체나 특정 종족을 범죄자 집단으로 취급하지 않는다. 닫힌 사회의 내부 질서와 외부에서 유입된 삶들이 함께 존재한다.\"], [\"IDENTITY\", \"짙은 붉음, 글라디올러스\", \"상징색은 다크 레드와 다크 그레이, 상징꽃은 글라디올러스. 학교의 상징색과 꽃 엠블럼을 담은 제복을 착용한다.\"], [\"PRIME\", \"공적인 정예와 비밀의 경계\", \"녹턴의 프라임 역시 학생회 역할을 겸하는 정예부대다. 그러나 비밀 암살부대 이클립스 소속은 프라임이 될 수 없다. 두 조직의 소속과 역할은 구분된다.\"], [\"ECLIPSE\", \"알려지지 않은 필요악\", \"이클립스는 녹턴 내부에서도 존재를 쉽게 알 수 없는 비밀 암살부대다. 제니스특수청이 절대선의 공공기관으로 남아야 하기에, 이클립스는 그와 대조되는 필요악의 역할을 맡는다. 위험인물과 배신자를 제거하며 공개적인 전면전과 구분되는 은밀한 임무를 수행한다.\\n\\n이러한 역할의 대조가 두 조직의 공식 지휘·위탁 관계를 뜻하는 것은 아니다. 구체적인 조직 간 관계는 아직 정하지 않았다.\"], [\"COMMAND\", \"이클립스의 리더와 대원\", \"이클립스는 부대를 이끄는 리더와 그 아래 대원들로 구성된다. 부대원은 대부분 수인이며, 암살에 특화된 존재들이 많다. 모든 대원을 수인으로 한정하지는 않는다.\"], [\"PERSONNEL\", \"아카데미와 이클립스의 인명록\", \"학장·교수·프라임·전투집행부 학생·전술통제부 학생을 기록한다. 이클립스는 별도 분류로 리더와 대원을 기록하며, 프라임 분류와 겹치지 않는다.\"]]}, \"zenith\": {\"en\": \"Zenith\", \"name\": \"제니스특수청\", \"realm\": \"PUBLIC INSTITUTION / THE HIGHEST STANDARD\", \"location\": \"위치 비공개 · 특수 게이트\", \"flower\": \"에델바이스\", \"colors\": \"퓨어 화이트 × 골드\", \"lead\": \"국가가 설립한 최정예 의회기관.\\n가장 위험한 현장에 투입되어 생명을 지키고, 착취당하는 약자를 보호한다.\", \"sections\": [[\"INSTITUTION\", \"국가가 만든 최정예 공공기관\", \"제니스특수청은 아카데미가 아니라 국가가 설립한 최정예 의회기관이다. 공공기관으로서 절대선의 존재로 남아야 하며, 세 세계의 위험한 현장과 위협에 대응한다.\"], [\"RECRUITMENT\", \"접촉과 선발 시험\", \"각 아카데미의 졸업생들이 모이는 교육기관이 아니다. 뛰어난 역량을 보이는 최정예 아카데미생에게 직접 접촉해 영입하거나, 인원을 모집하는 선발 시험을 치른다. 구체적인 시험 주기와 지원 요건은 미정이다.\"], [\"OUTER RESPONSE\", \"가장 위험한 아우터의 토벌\", \"가장 위험한 아우터를 상대하는 토벌 임무를 수행한다. 최정예 전력과 전문 인력을 위험한 현장에 투입한다.\"], [\"PUBLIC SERVICE\", \"현장 대응과 약자 보호\", \"위험한 현장에서 공공의 안전을 지키는 역할과, 착취당하는 약자를 보호하는 역할을 담당하는 부서가 있다. 부서별 세부 명칭과 조직도는 아직 확정하지 않았다.\"], [\"ORGANIZATION\", \"프라임 대신 부서 체계\", \"제니스특수청에는 프라임이 없다. 인원은 부서에 소속되며, 인명록에서 부서명과 세부 직책을 자유롭게 기록할 수 있다. 기존 아카데미식 학장·교수·학생회 조직은 적용하지 않는다.\"], [\"IDENTITY\", \"순백과 금빛 에델바이스\", \"상징색은 퓨어 화이트와 골드, 상징꽃은 에델바이스. 제복을 착용한다.\"], [\"CONTRAST\", \"빛 아래의 제니스, 그림자의 이클립스\", \"제니스특수청은 절대선의 존재로서 공적인 보호와 대응을 수행한다. 이클립스는 위험인물과 배신자를 은밀하게 제거하는 필요악이다. 역할은 대조되지만, 서로의 공식 소속·지휘·의뢰 관계는 별도로 정해지지 않았다.\"]]}},replace={\"교복형 제복\": \"제복\", \"제니스 특수청 아카데미\": \"제니스특수청\", \"제니스특수청 아카데미\": \"제니스특수청\", \"제니스 아카데미\": \"제니스특수청\", \"4대 아카데미\": \"3대 아카데미\", \"네 아카데미\": \"세 아카데미\", \"제니스 프라임\": \"제니스특수청 부서\", \"각 아카데미의 랭킹 상위권 부서\": \"각 아카데미의 학생회 역할을 겸하는 정예부대\", \"유니온 프라임 · 아르카디아 프라임 · 녹턴 프라임 · 제니스특수청 부서\": \"유니온 프라임 · 아르카디아 프라임 · 녹턴 프라임\", \"엑스큐터 학생회장\": \"프라임\", \"아키텍트 학생회장\": \"프라임\", \"천계와 하계 사이에는 여전히 강한 라이벌 의식이 남아 있다.\": \"천계에는 과거의 종족적 우월의식에서 비롯된 권위적인 문화가 일부 남아 있으며, 하계는 폐쇄적인 사회를 이룬다.\", \"우아하고 퇴폐적이며 자유로운 밤의 아카데미.\": \"마족과 수인이 대표적인 폐쇄적 하계의 아카데미.\", \"우아한 자유와 은밀한 계약, 짙은 밤의 야망이 교차한다.\": \"닫힌 경계 안에서 마족과 수인, 다른 세계를 떠난 자들의 삶이 겹쳐진다.\"};const rewrite=s=>{if(typeof s!=='string')return s;for(const [a,b]of Object.entries(replace))s=s.split(a).join(b);return s};const academy=JSON.parse(localStorage.getItem('trinity-academies-v1')||'{}');for(const [id,record]of Object.entries(academy)){if(!old[id]||!record)continue;for(const [field,v]of Object.entries(old[id])){if(field==='sections')continue;if(record[field]===v)record[field]=newData[id][field];else record[field]=rewrite(record[field])}if(Array.isArray(record.sections)){if(JSON.stringify(record.sections)===JSON.stringify(old[id].sections))record.sections=newData[id].sections;else{record.sections=record.sections.map(s=>{const prior=old[id].sections.find(v=>JSON.stringify(v)===JSON.stringify(s));if(prior){return newData[id].sections.find(v=>v[0]===s[0])||s.map(rewrite)}return s.map(rewrite)})}}}if(Object.keys(academy).length)localStorage.setItem('trinity-academies-v1',JSON.stringify(academy));const edits=JSON.parse(localStorage.getItem('trinity-world-edits')||'{}');for(const k of Object.keys(edits))edits[k]=rewrite(edits[k]);localStorage.setItem('trinity-world-edits',JSON.stringify(edits));localStorage.setItem(stamp,'1')}catch(e){console.warn('설정 갱신을 저장하지 못했습니다. 기존 기록은 보관됩니다.')}})();\n\n\n(()=>{try{const edits=JSON.parse(localStorage.getItem('trinity-world-edits')||'{}');const removed={};for(const key of Object.keys(edits)){if(/^section-(3|4|7)-/.test(key)||/^role-/.test(key)){removed[key]=edits[key];delete edits[key]}else if(typeof edits[key]==='string')edits[key]=edits[key].replaceAll('스틸 아티팩터','마법 제작자')}i
